[package]
name = "kchess-client"
description = "The profile's core as a frontend holds it, without the core: connecting to the shared core service (starting it when none runs), its protocol and socket, the profile's layout, and a core embedded by the frontend's host (docs/shared-core.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kchess-contracts.workspace = true
# The core's configuration (`kchess_host::config`) and the development overrides.
kchess-host.workspace = true
# The names packages install programs under, and the file digest of the runtime copy.
kchess-delta.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
# The socket name and the protocol fingerprint.
sha2 = { version = "0.11", default-features = false }
# The connection token.
getrandom = "0.4"
kchess-hack = { version = "0.1", path = "../kchess-hack" }

# The caller's user id, checked against the socket's peer and the runtime folder's owner.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# The pipe's owner-only security descriptor and the owner check.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
