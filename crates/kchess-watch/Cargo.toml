[package]
name = "kchess-watch"
description = "KChess's Watch page over GPUI: Lichess TV, the games of the players you follow, and broadcasts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# What the app's end-to-end tests read: TV's channels and a broadcast's round.
test-support = ["kchess-board/test-support"]

[dependencies]
kchess-app.workspace = true
kchess-board.workspace = true
kchess-contracts.workspace = true
# Lichess pictures build their HTTP client there (`kchess_host::http`).
kchess-host.workspace = true
kchess-domain.workspace = true
kchess-games.workspace = true
kchess-nav.workspace = true
kchess-ui.workspace = true
# Pinned with the app's (apps/gpui/Cargo.toml).
gpui-kit = "=0.11.0"
futures = "0.3"
serde_json.workspace = true
shakmaty.workspace = true
# Pictures Lichess serves (`src/remote_image.rs`): the one request a frontend makes of its own
# but the updater's, on a runtime of its own; both already in Cargo.lock through the core.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "http2", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util"] }
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[dev-dependencies]
# Headless windows for the tests (`#[gpui_kit::test]`).
gpui-kit = { version = "=0.11.0", features = ["test-support"] }
# A real core over a fresh profile, Settings, the theme and a window, for the tests
# (`kchess_board::testing::Started`).
kchess-app = { workspace = true, features = ["test-support"] }
kchess-board = { workspace = true, features = ["test-support"] }
# A shell holding only this page (`kchess_nav::testing::OnlyPage`).
kchess-nav = { workspace = true, features = ["test-support"] }

# A stand-in Lichess (`kchess_testkit::Server`).
kchess-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true
