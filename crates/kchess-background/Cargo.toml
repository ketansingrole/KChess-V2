[package]
name = "kchess-background"
description = "What keeps KChess running without its window: the menu bar or system tray icon and its menu, and the entry that opens KChess when the person logs in."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The autostart folder's place (`XDG_CONFIG_HOME`, `APPDATA`) as the process reads its switches.
kchess-host.workspace = true
kchess-hack = { version = "0.1", path = "../kchess-hack" }

# The menu bar item: NSStatusItem with a template image and an NSMenu (AppKit, as the Dock icon
# is set in the app).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSObject", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "NSCell", "NSApplication"] }

# The notification area icon (Shell_NotifyIcon) and its popup menu, on a hidden window, and
# the Startup folder's shortcut (IShellLink). Only features GPUI's own Windows crate enables, so the
# app and GPUI build one `windows` crate (`hack::one_feature_set_for_the_app_and_the_rest`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The tray item over D-Bus (StatusNotifierItem and its menu), pure Rust over zbus, which GPUI
# already runs on async-io; and the icon's pixels from its PNG.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
png = "0.18"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
