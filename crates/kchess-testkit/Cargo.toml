version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[dev-dependencies]
# Scratch target folders for the build tests (`src/build.rs`).
tempfile = "3"

[lints]
workspace = true
