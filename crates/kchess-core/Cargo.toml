[package]
name = "kchess-core"
description = "KChess core services: storage, engines, Lichess and the rest of the headless core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kchess-domain = { path = "../kchess-domain" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
zstd = "0.13"
# `crypto.randomUUID()` for study and chapter ids (already in Cargo.lock through rustls and tempfile).
getrandom = "0.2"
# Engine download: SHA-256 digest check (`sha2`), archive extraction (`flate2` inflates tar.gz,
# `tar`, `zip` with deflate only, no symlinks), a private staging directory (`tempfile`), and
# `access(2)` for the executable check of `engine/status.rs` (`libc`, already in Cargo.lock).
sha2 = { version = "0.10", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

# Lichess OAuth PKCE: the S256 challenge is base64url(SHA-256(verifier)) (`base64` 0.22 is already
# in Cargo.lock through reqwest; MIT/Apache-2.0, GPL-compatible).
base64 = "0.22"

# `CancellationToken`: the AbortSignal of the engine controllers and scheduler. Already in
# Cargo.lock through reqwest; no new code is pulled in.
tokio-util = { version = "0.7", features = ["rt"] }

# libc: `access(2)` for engine/status.rs, and SIGTERM before SIGKILL as Node's
# `ChildProcess.kill()` does (tokio can only send SIGKILL).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The method table the facade's dispatch is checked against (tests/facade_dispatch.rs).
kchess-contracts = { path = "../kchess-contracts" }

# A scripted UCI engine for the engine tests (see tests/support/fake_uci.rs).
[[bin]]
name = "kchess-fake-uci"
path = "tests/support/fake_uci.rs"
