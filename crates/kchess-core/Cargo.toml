[package]
name = "kchess-core"
description = "KChess core services: storage, engines, Lichess and the rest of the headless core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The errors and log levels the core shares with its frontends, and the method table the facade
# is checked against (tests/facade_dispatch.rs).
kchess-contracts = { path = "../kchess-contracts" }
kchess-domain = { path = "../kchess-domain" }
# Lowercase hex and the SHA-256 of a file (`hex`, `file_digest`).
kchess-delta = { path = "../kchess-delta" }
# The speech helper's pipe protocol (`voice/recognizer.rs`, the fake helper).
kchess-voice = { path = "../kchess-voice" }
serde.workspace = true
serde_json.workspace = true
# The `KCHESS_*` switches, development overrides and the App Store sandbox.
kchess-host = { path = "../kchess-host" }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
# `gzip`: API answers (JSON, NDJSON, PGN) arrive compressed; byte-exact downloads and live
# streams opt out (`no_gzip`, `policy::is_live_stream`).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "gzip"] }
futures-util = "0.3"
# The chunks `download::Resumable` hands on, as reqwest reads them (already in Cargo.lock).
bytes = "1"
# Pure-Rust zstd decoder for the puzzle database (no C library to build).
ruzstd = "0.9"
# Random study and chapter ids (already in Cargo.lock through rustls and tempfile).
getrandom = "0.4"
# UUID layout and formatting over those random bytes (no `v4` feature: the bytes come from getrandom).
uuid = { version = "1", default-features = false, features = ["std"] }
# Engine download: SHA-256 digest check (`sha2`), archive extraction (`flate2` inflates tar.gz,
# `tar`, `zip` with deflate only, no symlinks), and a private staging directory (`tempfile`).
sha2 = { version = "0.11", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

# Lichess OAuth PKCE: the S256 challenge is base64url(SHA-256(verifier)) (`base64` 0.23 is already
# in Cargo.lock through reqwest; MIT/Apache-2.0, GPL-compatible).
base64 = "0.23"

# Profile credentials (`secrets.rs`): Lichess tokens sealed with AES-256-GCM (`aes-gcm`, RustCrypto,
# MIT/Apache-2.0; its `aes` is already in Cargo.lock) under a key the OS credential store keeps
# (`keyring`: Keychain, Credential Manager, Secret Service; MIT/Apache-2.0), so every KChess app on
# the profile opens the same tokens.
aes-gcm = "0.11"
keyring = { version = "4", default-features = false, features = ["v1"] }

# `CancellationToken`: cancels the engine controllers and scheduler. Already in
# Cargo.lock through reqwest; no new code is pulled in.
tokio-util = { version = "0.7", features = ["rt"] }
kchess-hack = { version = "0.1", path = "../kchess-hack" }

# rustix (already in Cargo.lock through tempfile): `access(2)` for engine/status.rs, and SIGTERM
# before SIGKILL, so an engine can exit cleanly (tokio can only send SIGKILL), without unsafe.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[features]
# Set by `cargo xtask package` for every shipped build: the development overrides (test switch,
# engine and helper paths, update feed) are ignored (`dev_overrides` in lib.rs).
packaged = ["kchess-host/packaged"]

[dev-dependencies]
# Random legal games for the compression benchmark (`examples/http_compression.rs`).
shakmaty.workspace = true

# A scripted UCI engine for the engine tests (see tests/support/fake_uci.rs).
[[bin]]
name = "kchess-fake-uci"
path = "tests/support/fake_uci.rs"

# A scripted speech recognition helper for the voice tests (see tests/support/fake_voice.rs).
[[bin]]
name = "kchess-fake-voice"
path = "tests/support/fake_voice.rs"

[lints]
workspace = true
