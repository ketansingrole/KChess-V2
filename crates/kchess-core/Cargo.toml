[package]
name = "kchess-core"
description = "KChess core services: storage, engines, Lichess and the rest of the headless core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kchess-domain = { path = "../kchess-domain" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
zstd = "0.13"
# `crypto.randomUUID()` for study and chapter ids (already in Cargo.lock through rustls and tempfile).
getrandom = "0.2"
# Engine download: SHA-256 digest check (`sha2`), archive extraction (`flate2` inflates tar.gz,
# `tar`, `zip` with deflate only, no symlinks), a private staging directory (`tempfile`), and
# `access(2)` for the executable check of `engine/status.rs` (`libc`, already in Cargo.lock).
sha2 = { version = "0.10", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
