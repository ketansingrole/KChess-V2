[package]
name = "kchess-core"
description = "KChess core services: storage, engines, Lichess and the rest of the headless core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kchess-domain = { path = "../kchess-domain" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
# Pure-Rust zstd decoder for the puzzle database (no C library to build).
ruzstd = "0.9"
# `crypto.randomUUID()` for study and chapter ids (already in Cargo.lock through rustls and tempfile).
getrandom = "0.4"
# UUID layout and formatting over those random bytes (no `v4` feature: the bytes come from getrandom).
uuid = { version = "1", default-features = false, features = ["std"] }
# Engine download: SHA-256 digest check (`sha2`), archive extraction (`flate2` inflates tar.gz,
# `tar`, `zip` with deflate only, no symlinks), and a private staging directory (`tempfile`).
sha2 = { version = "0.11", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

# Lichess OAuth PKCE: the S256 challenge is base64url(SHA-256(verifier)) (`base64` 0.23 is already
# in Cargo.lock through reqwest; MIT/Apache-2.0, GPL-compatible).
base64 = "0.23"

# Profile credentials (`secrets.rs`): Lichess tokens sealed with AES-256-GCM (`aes-gcm`, RustCrypto,
# MIT/Apache-2.0; its `aes` is already in Cargo.lock) under a key the OS credential store keeps
# (`keyring`: Keychain, Credential Manager, Secret Service; MIT/Apache-2.0), so the Electron and
# GPUI apps open the same tokens. Electron's `safeStorage` format only Electron can read.
aes-gcm = "0.11"
# What the Electron app left in a profile: its localStorage and the logins its safeStorage sealed.
kchess-electron-legacy = { path = "../kchess-electron-legacy" }
keyring = { version = "4", default-features = false, features = ["v1"] }

# `CancellationToken`: the AbortSignal of the engine controllers and scheduler. Already in
# Cargo.lock through reqwest; no new code is pulled in.
tokio-util = { version = "0.7", features = ["rt"] }

# rustix (already in Cargo.lock through tempfile): `access(2)` for engine/status.rs, and SIGTERM
# before SIGKILL as Node's `ChildProcess.kill()` does (tokio can only send SIGKILL), without unsafe.
# libc: only the fake engine's `ignore-term` mode (tests/support/fake_uci.rs) ignores SIGTERM.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"

[dev-dependencies]
# The method table the facade's dispatch is checked against (tests/facade_dispatch.rs).
kchess-contracts = { path = "../kchess-contracts" }

# A scripted UCI engine for the engine tests (see tests/support/fake_uci.rs).
[[bin]]
name = "kchess-fake-uci"
path = "tests/support/fake_uci.rs"

# A scripted speech recognition helper for the voice tests (see tests/support/fake_voice.rs).
[[bin]]
name = "kchess-fake-voice"
path = "tests/support/fake_voice.rs"

[lints]
workspace = true
