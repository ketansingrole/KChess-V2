[package]
name = "kchess_board"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Visual chessboard library with move animations, rollback, and GPUI integration"

[features]
default = []
gpui = ["dep:gpui", "dep:lyon_tessellation"]

[dependencies]
gpui = { version = "0.2.2", optional = true, features = ["runtime_shaders"] }
lyon_tessellation = { version = "1.0", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
