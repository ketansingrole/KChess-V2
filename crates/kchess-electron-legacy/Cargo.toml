[package]
name = "kchess-electron-legacy"
description = "Reads what the Electron app left in a KChess profile: its localStorage and the logins its safeStorage sealed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Chromium keeps localStorage in LevelDB; read from a copy (MIT).
rusty-leveldb = { version = "4", default-features = false, features = ["fs"] }
base64 = "0.23"
serde_json = { workspace = true }
# Electron's safeStorage is Chromium's os_crypt: AES-128-CBC under a PBKDF2-HMAC-SHA1 key on macOS
# and Linux, AES-256-GCM under a DPAPI-protected key on Windows (RustCrypto, MIT/Apache-2.0).
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11", default-features = false }
aes-gcm = "0.10"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[lints]
workspace = true
