[package]
name = "kchess-home"
description = "KChess's Home page over GPUI: where to start, the game you left, recent games and Lichess activity."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# What the app's end-to-end tests read: the Lichess activity card and its summary.
test-support = ["kchess-board/test-support"]

[dependencies]
kchess-app.workspace = true
kchess-board.workspace = true
kchess-history.workspace = true
kchess-contracts.workspace = true
kchess-domain.workspace = true
kchess-nav.workspace = true
kchess-ui.workspace = true
# Pinned with the app's (apps/gpui/Cargo.toml).
gpui-kit = "=0.11.0"
serde_json.workspace = true
shakmaty.workspace = true
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[dev-dependencies]
# Headless windows for the tests (`#[gpui_kit::test]`).
gpui-kit = { version = "=0.11.0", features = ["test-support"] }
# A real core over a fresh profile, Settings, the theme and a window, for the tests
# (`kchess_board::testing::Started`).
kchess-app = { workspace = true, features = ["test-support"] }
kchess-board = { workspace = true, features = ["test-support"] }
# A shell holding only this page (`kchess_nav::testing::OnlyPage`).
kchess-nav = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
