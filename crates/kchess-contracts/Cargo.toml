[package]
name = "kchess-contracts"
description = "The core's contract types: serde shapes and the TypeScript types generated from them."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kchess-domain = { path = "../kchess-domain" }
serde.workspace = true
serde_json.workspace = true
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"
