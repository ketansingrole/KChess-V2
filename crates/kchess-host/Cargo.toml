[package]
name = "kchess-host"
description = "What the core and its frontends read alike of the process they run in: the KCHESS_* switches and development overrides, the App Store sandbox, log redaction, which links open in a browser, what a folder takes on disk and the files only their owner reads, and the core's configuration."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Diagnostics redaction (`redact.rs`).
regex = "1"
dirs = "7"
# `opens_in_browser` parses the URL (already in Cargo.lock through reqwest).
url = "2"
# The core's configuration crosses to the service as JSON (`config.rs`).
serde.workspace = true
# Every HTTP client starts in `http.rs`, with ring as rustls's cryptography (its reason there).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# A private file is written under a random name beside it (`disk::write_private`).
tempfile = "3"
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[dev-dependencies]
serde_json.workspace = true

[features]
# Set by `cargo xtask package` (through `kchess-core/packaged`) for every shipped build: the
# development overrides are ignored (`dev_overrides`).
packaged = []

[lints]
workspace = true
