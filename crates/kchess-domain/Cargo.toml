[package]
name = "kchess-domain"
description = "KChess chess and library rules, shared by every frontend through the core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shakmaty.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
memchr.workspace = true
# Unicode general categories (`\p{L}`, `\p{N}`) for the arena name check; already in Cargo.lock.
regex-syntax = "0.8"

[dev-dependencies]
regex = { version = "1" }
