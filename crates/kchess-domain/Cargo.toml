[package]
name = "kchess-domain"
description = "KChess chess and library rules, shared by every frontend through the core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shakmaty.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
memchr.workspace = true
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[dev-dependencies]
regex = { version = "1" }
# Regenerates and checks src/misc/unicode_tables.rs (patterns.rs tests).
regex-syntax = "0.8"
# Reads the rules corpus (tests/rules_corpus.rs).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11", default-features = false }
# The core's argument check, which the corpus pins for the methods it recorded.
kchess-contracts = { path = "../kchess-contracts" }

[lints]
workspace = true
