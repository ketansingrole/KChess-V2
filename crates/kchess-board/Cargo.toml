[package]
name = "kchess-board"
description = "KChess's board and the games on it over GPUI: the board, game sessions as views drive them, notation, sounds."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# What the app's end-to-end tests read: the sounds played, the board images kept, a session's
# pending question.
test-support = ["kchess-app/test-support"]

[dependencies]
kchess-app.workspace = true
kchess-contracts.workspace = true
kchess-domain.workspace = true
kchess-games.workspace = true
# A picture of a board to its position (`src/picture.rs`).
kchess-recognise.workspace = true
kchess-ui.workspace = true
# Pinned with the app's (apps/gpui/Cargo.toml).
gpui-kit = "=0.11.0"
serde.workspace = true
serde_json.workspace = true
shakmaty.workspace = true
futures = "0.3"
jiff = "1.0"
# The boards, pieces and sounds, embedded (`src/assets.rs`).
rust-embed = "8"
# Pictures of a game (`src/game_image.rs`): the board and pieces drawn (resvg), encoded as PNG or
# GIF (image); both already in Cargo.lock through GPUI.
resvg = "0.50"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Move and game sounds: the default output device (cpal) and the MP3 clips (Symphonia).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
# Voice input: the microphone (cpal, already in Cargo.lock through rodio) and the PCM the core's
# recognizer takes, as base64 (already in Cargo.lock through the core).
cpal = "0.18"
# The Downloads folder exports start in (`src/export.rs`).
dirs = "7"
base64 = "0.23"
kchess-hack = { version = "0.1", path = "../kchess-hack" }

# Microphone access status and the system's request for it: AVCaptureDevice, macOS 10.14 and
# later.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"

# Microphone access status, and whether the output is a Bluetooth one: what Windows keeps in the
# registry (already in Cargo.lock through GPUI).
[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.100"
# The "playing" state some Bluetooth speakers wait for before they play a sound
# (`src/sound/playing.rs`): Windows' media controls and its list of what is playing. The crate is
# already in Cargo.lock through GPUI; these features are this crate's alone.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media", "Media_Control", "Media_Playback"] }

[dev-dependencies]
# Headless windows for the tests (`#[gpui_kit::test]`).
gpui-kit = { version = "=0.11.0", features = ["test-support"] }
# Default Settings without a core, for the tests (`settings::init_for_tests`).
kchess-app = { workspace = true, features = ["test-support"] }
# Scratch folders for the export tests.
tempfile = "3"
# A stand-in Lichess for the puzzle database's download (`puzzle_db.rs`), and the seeded random
# positions board pictures are measured on (`picture/corpus.rs`).
kchess-testkit.workspace = true
# The switch that keeps the pictures read wrongly (`picture/corpus.rs`).
kchess-host.workspace = true

[lints]
workspace = true
