[package]
name = "kchess-voice"
description = "Offline speech recognition for KChess: a helper process over the Vosk library."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kchess-voice"
path = "src/main.rs"

[dependencies]
# Loads libvosk from beside the executable at run time, so the build never links it (already in
# Cargo.lock through napi).
libloading = "0.9"
serde.workspace = true
serde_json.workspace = true

[lints]
# Manual table: cargo 1.94 rejects combining `workspace = true` with overrides, and this crate
# calls the Vosk C API (src/vosk.rs). Mirrors [workspace.lints] except unsafe_code.
[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "allow"
indexing_slicing = "allow"
unwrap_used = "allow"
expect_used = "allow"
