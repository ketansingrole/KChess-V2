[package]
name = "kchess-voice"
description = "Offline speech recognition for KChess: a helper process over the Vosk library."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kchess-voice"
path = "src/main.rs"

[dependencies]
# Loads libvosk from beside the executable at run time, so the build never links it.
libloading = "0.9"
serde.workspace = true
serde_json.workspace = true
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[lints]
workspace = true
