[package]
name = "kchess-nav"
description = "KChess's pages as the shell drives them over GPUI: what a page declares, opening one from another, the board pages' layout."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# What the pages' tests share: a shell holding one page (`testing::OnlyPage`).
test-support = []

[dependencies]
# `KCHESS_PAGE_FILE`, as a test sets it in memory too.
kchess-host.workspace = true
kchess-app.workspace = true
kchess-board.workspace = true
kchess-ui.workspace = true
# Pinned with the app's (apps/gpui/Cargo.toml).
gpui-kit = "=0.11.0"
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[dev-dependencies]
# Headless windows for the tests (`#[gpui_kit::test]`).
gpui-kit = { version = "=0.11.0", features = ["test-support"] }

[lints]
workspace = true
