[package]
name = "kchess-ui"
description = "KChess's design system over GPUI Kit: the theme and its colors, motion, the line chart, the generic widgets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kchess-contracts.workspace = true
kchess-domain.workspace = true
# Pinned with the app's (apps/gpui/Cargo.toml): a newer gpui-kit requires a newer gpui-pre than the
# patched copy in vendor/gpui-pre.
gpui-kit = "=0.10.0"
serde_json.workspace = true
# Dates and times in local time and UTC (`src/dates.rs`), as the app's.
jiff = "1.0"
kchess-hack = { version = "0.1", path = "../kchess-hack" }

# KDE's animation setting, under the user's config folder (`motion.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
dirs = "7"

# The system's reduced-motion setting (NSWorkspace).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }

# The system's reduced-motion setting (`SystemParametersInfoW`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Headless windows and app contexts for the tests (`#[gpui_kit::test]`).
gpui-kit = { version = "=0.10.0", features = ["test-support"] }

[lints]
workspace = true
