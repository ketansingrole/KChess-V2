[package]
name = "kchess-node"
description = "N-API binding of the KChess Rust core for Node and Electron hosts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
kchess-domain = { path = "../kchess-domain" }
kchess-core = { path = "../kchess-core" }
napi = { version = "3", features = ["napi8", "tokio_rt"] }
napi-derive = "3"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
