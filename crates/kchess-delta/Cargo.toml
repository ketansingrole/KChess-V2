[package]
name = "kchess-delta"
description = "Update patches: a release's program files rebuilt from the installed ones and per-file binary patches."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", default-features = false }
# bsdiff patches, bzip2-compressed: a rebuilt binary differs from the last by a few percent.
qbsdiff = "1.4"
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[lints]
workspace = true
