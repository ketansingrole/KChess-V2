[package]
name = "kchess-service"
description = "The shared KChess core: one core per profile, served to every KChess window over a local socket, and the core embedded by a frontend's host (docs/shared-core.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kchess-service"
path = "src/bin/kchess-service.rs"

[dependencies]
# What a frontend holds of its core, re-exported for the programs that host it.
kchess-client.workspace = true
kchess-contracts.workspace = true
kchess-core.workspace = true
kchess-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net", "signal"] }
kchess-hack = { version = "0.1", path = "../kchess-hack" }

[dev-dependencies]
tempfile = "3"
kchess-testkit.workspace = true

[lints]
workspace = true
