[package]
name = "kchess-wasm"
description = "The KChess Rust rules as WebAssembly for the renderer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
kchess-domain = { path = "../kchess-domain" }

[lints]
# Manual table: cargo 1.94 rejects combining `workspace = true` with overrides,
# and this crate needs unsafe for its C ABI (kc_alloc/kc_free/kc_invoke). Mirrors
# [workspace.lints] except unsafe_code.
[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "allow"
redundant_clone = "allow"
unwrap_used = "allow"
expect_used = "allow"
