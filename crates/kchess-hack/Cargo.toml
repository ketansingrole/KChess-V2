# This file is generated by `cargo hakari`.
# To regenerate, run:
#     cargo hakari generate

[package]
name = "kchess-hack"
# hakari writes `version = "0.1"` into every package's dependency on it, so it keeps its own.
version = "0.1.0"
description = "One feature set for every dependency, whichever packages a build selects (.config/hakari.toml)."
edition.workspace = true
license.workspace = true
publish.workspace = true

# Two that cargo-hakari 0.9.39 leaves out though their features still depend on the selection
# (`cargo tree -f '{p} {f}'`): syn 2, which it writes for Linux only, though the app's proc macros
# (rust-embed, derive_more, cbindgen) give it more features on every platform, so `cargo test -p
# kchess-core` built tracing's macros, reqwest and the core under other hashes than the workspace
# did; and slab, which `-p kchess-domain`, `-p kchess-voice` or xtask alone built without its
# default feature, so futures-util and this package too.
[target.'cfg(all())'.dependencies]
slab = { version = "0.4" }

[target.'cfg(all())'.build-dependencies]
syn-f595c2ba2a3f28df = { package = "syn", version = "2", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }

