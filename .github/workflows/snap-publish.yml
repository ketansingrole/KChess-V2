name: Publish Snap

# Drafts and tag pushes never update the store. Publish the reviewed GitHub release first.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: snap-store-stable
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    steps:
      # Run trusted publishing code from main, never code supplied by a release asset.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Download and verify the published Snap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cargo xtask download-release-snap
      # The store gets only a Snap that starts: installed here, it must still be running after 30
      # seconds on a virtual display (Mesa's software Vulkan) and have logged its start.
      - name: Start the Snap
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo snap install --dangerous packages/*.snap
          set +e
          xvfb-run -a timeout 30 snap run kchess > snap-run.log 2>&1
          code=$?
          set -e
          cat snap-run.log | tail -40
          log=$(find "$HOME/snap/kchess" -path '*KChess/logs/kchess.log' 2>/dev/null | head -n 1)
          test -n "$log" && tail -20 "$log"
          test "$code" = 124 || { echo "::error::The Snap exited (code $code) before 30 seconds."; exit 1; }
          test -n "$log" && grep -q "KChess started" "$log" || { echo "::error::The Snap did not log its start."; exit 1; }
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Publish to latest/stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          test -n "$SNAPCRAFT_STORE_CREDENTIALS" || { echo '::error::Add the restricted SNAPCRAFT_STORE_CREDENTIALS repository secret.'; exit 1; }
          snapcraft upload packages/*.snap --release=latest/stable
