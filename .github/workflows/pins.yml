name: Pins
# Every download the build pins by version and SHA-256 (tooling/xtask/src/pinned.rs, and the
# shipped Stockfish in crates/kchess-core/src/engine/managed/shipped.rs). Weekly and on demand,
# never in ci.yml, so a new upstream release cannot turn a pull request red. When one is behind,
# this opens (or updates) one issue naming the release and the file to change; the pin then moves
# in a reviewed pull request that CI builds and tests. The run fails only when the check itself
# cannot answer.
on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # CI's caches, read only: this workflow saves none of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - name: Check the pins
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/pins.md
        run: |
          if cargo xtask pins --check --report "$REPORT"; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          elif [ -s "$REPORT" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The pin check could not read the upstream releases."
            exit 1
          fi
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEHIND: ${{ steps.check.outputs.behind }}
          REPORT: ${{ runner.temp }}/pins.md
          TITLE: Newer releases of pinned downloads
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg title "$TITLE" 'map(select(.title == $title)) | .[0].number // empty')
          if [ "$BEHIND" = true ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$REPORT"
            else
              gh issue create --title "$TITLE" --body-file "$REPORT"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The pins match the newest releases."
          fi
