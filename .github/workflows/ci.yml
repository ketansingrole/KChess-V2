name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Nightly: main's packages, Snap and Windows upgrade, when packaging changed since main last
  # packaged (`changes`); the rest of CI ran on each push. By hand: package main now.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its run; every run on main runs to the end, so each
# commit has a result (`cargo xtask release-verify` needs its release commit's).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `.config/nextest.toml`: report every failure of the run, not only the first.
  NEXTEST_PROFILE: ci
  GPUI_LINUX_LIBS: >-
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev
    desktop-file-utils

jobs:
  # Whether to package. The packages, the Snap and the Windows upgrade take most of CI's time
  # (2026-11-09: 20 to 30 minutes on a push to main), so they run only for
  # - a pull request whose change may touch packaging (since its base): it packages before it lands;
  # - a release commit: it changes Cargo.toml's version, and is the commit the tag will build;
  # - the nightly run, when packaging may have changed since main last packaged: measured from the
  #   newest main commit whose packaging jobs all passed (else the last release), so a change keeps
  #   running them each night until they pass. A push to main does not: its pull request packaged.
  # - a run started by hand, always.
  #
  # Whether this push or pull request changes more than the documents nothing reads. A release
  # commit changes Cargo.toml, so `cargo xtask release-verify` never meets a skipped `check`.
  #
  # Whether this is a release commit. Only those package with the release profile's fat LTO, whose
  # link takes over half of a package job: their run tests what the tag will build, and saves the
  # dependencies the Release workflow restores.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.docs.outputs.code }}
      release: ${{ steps.docs.outputs.release }}
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: docs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          DOCS: '^(docs/|site/|(AGENTS|ARCHITECTURE|CONTRIBUTING|CORE_FRONTENDS|GUARDRAILS|README|RUST_MIGRATION|SECURITY)\.md$)'
        run: |
          # The nightly and by-hand runs only package: each push to main ran the rest.
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            code=false
          elif files="$(git diff --name-only "$BASE" HEAD)" && [ -z "$(echo "$files" | grep -vE "$DOCS")" ]; then
            code=false
          else
            code=true
          fi
          echo "Code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ] && git diff "$BASE" HEAD -- Cargo.toml | grep -q '^+version = '; then
            release=true
          else
            release=false
          fi
          echo "Release commit: $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # The packaging jobs by their names (`package (<os>)`, `snap / …`, `windows-upgrade / …`):
      # renaming one of them needs this pattern changed too.
      # The nightly run's base: the newest main commit, this one included, that a push or nightly
      # run packaged.
      - id: packaged
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list --workflow ci.yml --branch main --status success --limit 60 \
              --json databaseId,headSha,event --jq '.[] | select(.event == "push" or .event == "schedule") | "\(.databaseId):\(.headSha)"'); do
            sha="${run#*:}"
            git merge-base --is-ancestor "$sha" HEAD 2>/dev/null || continue
            if gh run view "${run%%:*}" --json jobs --jq '[.jobs[] | select(.name | test("^(package |snap|windows-upgrade)")) | .conclusion] | length > 0 and all(. == "success")' | grep -qx true; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || steps.packaged.outputs.sha }}
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ steps.docs.outputs.release }}
          # The files packaging is made from; xtask's `packaging_changes_run_the_package_jobs`
          # checks it names each of xtask's.
          PACKAGING: '^(Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/|apps/gpui/build\.rs$|apps/gpui/build/|crates/kchess-voice/|crates/kchess-delta/|tooling/xtask/src/(package/|deb\.rs$|deltas\.rs$|engines\.rs$|fairy\.rs$|licenses\.rs$|sums\.rs$|util\.rs$|voice\.rs$)|tooling/windows-upgrade-test\.ps1$|\.github/actions/|\.github/workflows/(ci|release|snap-build|windows-upgrade)\.yml$)'
        run: |
          if [ "$RELEASE" = true ] || [ "$EVENT" = workflow_dispatch ]; then
            packaging=true
            echo "Packaging: a release commit or a run by hand"
          elif [ "$EVENT" = push ]; then
            packaging=false
            echo "Packaging: not on a push to main (its pull request packaged; the nightly run packages main)"
          else
            base="${BASE:-$(git describe --tags --abbrev=0 --match 'v2*' HEAD 2>/dev/null || true)}"
            if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -qE "$PACKAGING"; then
              packaging=true
            else
              packaging=false
            fi
            echo "Packaging changed since ${base:-the start}: $packaging"
          fi
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  # `cargo xtask check`: format, lints, notices, release metadata and the tests under the coverage
  # gate, as the pre-push hook runs them, but the app's tests, which `gpui` runs on Linux beside it
  # (2026-11-09: 6 of check's 12 minutes). This is also the app's lints on Linux.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install GPUI build libraries
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      # Compiled Rust dependencies, restored on every run and saved only from main (the repository's
      # cache quota is shared): only KChess's own crates recompile. CI and release jobs share keys.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest
      # `cargo xtask check` refuses a workspace hack that `cargo hakari` would write differently.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-hakari
      - run: rustup component add llvm-tools-preview
      # The official Stockfish, so the tests that need a real engine run (`tests/support`), and
      # Fairy-Stockfish, built from its pinned source, so the variant-analysis tests run too.
      # Kept between runs, keyed by their pins: fetching them built the fetcher and Fairy-Stockfish
      # anew each time (2026-11-09: 70 s of this job and of each mutants shard).
      - id: engines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/stockfish
            target/fairy-stockfish/bin
          key: engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/kchess-core/src/engine/managed.rs', 'tooling/xtask/src/fairy.rs') }}
      - name: Fetch the engines
        if: steps.engines.outputs.cache-hit != 'true'
        run: cargo xtask engines --github-env "$RUNNER_TEMP/stockfish"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Name the kept engines
        if: steps.engines.outputs.cache-hit == 'true'
        run: |
          echo "KCHESS_ENGINE_PATH=$RUNNER_TEMP/stockfish/stockfish" >> "$GITHUB_ENV"
          echo "KCHESS_VARIANT_ENGINE_PATH=$PWD/target/fairy-stockfish/bin/fairy-stockfish" >> "$GITHUB_ENV"
      - run: cargo xtask check --without-app-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: check-measurements
          path: test-results/rust-coverage/summary.json
          if-no-files-found: ignore
          retention-days: 30

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny
      - run: cargo deny check
      # The fuzz workspace has its own lock file.
      - run: cargo deny --manifest-path fuzz/Cargo.toml check

  # The app's unit and end-to-end tests (`src/e2e`, headless) on every platform; `headless` runs
  # the rest beside it, the app's lints included.
  gpui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install GPUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      # Windows links its tests with LLVM's linker (rustup ships it), which links faster than
      # Microsoft's; the packages that ship keep Microsoft's. Set before the cache, whose key
      # holds Cargo's variables, and on Windows only, so the other caches stay as they are.
      - name: Link with rust-lld
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gpui
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The vendored GPUI (`vendor/`) heads the app's longest chain of crates, and was compiled
      # anew on every run (2026-11-09: most of the 5 to 6 minutes the app's test build took):
      # rust-cache keeps only crates from outside the repository, and Cargo rebuilds a path crate
      # whose files are newer than its build, as a fresh checkout's are. So its files get a fixed
      # old date and its build a cache of its own, keyed by those files: Cargo finds it up to date,
      # and with it the registry crates built on it, until a file of it changes.
      - name: Date the vendored sources
        shell: bash
        run: find vendor -type f -exec touch -t 200001010000 {} +
      - id: vendor
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Their libraries are named gpui, gpui_apple, gpui_macos and gpui_windows.
          path: |
            target/**/deps/libgpui-*
            target/**/deps/gpui-*.d
            target/**/deps/libgpui_apple-*
            target/**/deps/gpui_apple-*.d
            target/**/deps/libgpui_macos-*
            target/**/deps/gpui_macos-*.d
            target/**/deps/libgpui_windows-*
            target/**/deps/gpui_windows-*.d
            target/**/.fingerprint/gpui-pre*
            target/**/build/gpui-pre*
          key: vendor-gpui-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/**', 'Cargo.lock', 'rust-toolchain.toml') }}
      # The app's tests under `cargo test`: each starts GPUI, so a process per test (nextest) is slower.
      # They mostly wait on the app's timers and tasks (2026-11-09, three threads: 57 s of CPU in
      # 320 s), so more threads than the runners' 3 or 4 cores finish them sooner. Not on Windows:
      # eight at once starved its runner until the tests' own local servers timed out (2026-11-10,
      # two runs of five, each a different test).
      - run: cargo test -p kchess-gpui --locked
        env:
          RUST_TEST_THREADS: ${{ runner.os == 'Windows' && 4 || 8 }}
      - if: github.ref == 'refs/heads/main' && steps.vendor.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Their libraries are named gpui, gpui_apple, gpui_macos and gpui_windows.
          path: |
            target/**/deps/libgpui-*
            target/**/deps/gpui-*.d
            target/**/deps/libgpui_apple-*
            target/**/deps/gpui_apple-*.d
            target/**/deps/libgpui_macos-*
            target/**/deps/gpui_macos-*.d
            target/**/deps/libgpui_windows-*
            target/**/deps/gpui_windows-*.d
            target/**/.fingerprint/gpui-pre*
            target/**/build/gpui-pre*
          key: ${{ steps.vendor.outputs.cache-primary-key }}

  # Everything else on the other platforms, beside `gpui` rather than after it: the app's lints
  # (`check` lints it on Linux; here its macOS and Windows code), the command line and xtask, and
  # on Windows the headless packages, which `check` runs on Linux; here they keep building and
  # passing on Windows: named pipes, CRLF checkouts, Unix-only test helpers.
  headless:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            packages: -p kchess-cli -p xtask
          # `check` runs these on Linux; here they keep building and passing on Windows.
          - os: windows-latest
            packages: -p kchess-cli -p xtask -p kchess-domain -p kchess-core -p kchess-service
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Windows links its tests with LLVM's linker (rustup ships it), which links faster than
      # Microsoft's; the packages that ship keep Microsoft's. Set before the cache, whose key
      # holds Cargo's variables, and on Windows only, so the other caches stay as they are.
      - name: Link with rust-lld
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: headless
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The vendored GPUI's lint build, kept as the gpui job keeps its test build.
      - name: Date the vendored sources
        shell: bash
        run: find vendor -type f -exec touch -t 200001010000 {} +
      - id: vendor
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/**/deps/libgpui-*
            target/**/deps/gpui-*.d
            target/**/deps/libgpui_apple-*
            target/**/deps/gpui_apple-*.d
            target/**/deps/libgpui_macos-*
            target/**/deps/gpui_macos-*.d
            target/**/deps/libgpui_windows-*
            target/**/deps/gpui_windows-*.d
            target/**/.fingerprint/gpui-pre*
            target/**/build/gpui-pre*
          key: vendor-headless-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/**', 'Cargo.lock', 'rust-toolchain.toml') }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest
      # One clippy and one nextest over all of them: separate runs resolved features apart and
      # rebuilt the dependencies they share.
      - run: cargo clippy -p kchess-gpui ${{ matrix.packages }} --all-targets --locked -- -D warnings
      - run: cargo nextest run ${{ matrix.packages }} --locked
      - if: github.ref == 'refs/heads/main' && steps.vendor.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/**/deps/libgpui-*
            target/**/deps/gpui-*.d
            target/**/deps/libgpui_apple-*
            target/**/deps/gpui_apple-*.d
            target/**/deps/libgpui_macos-*
            target/**/deps/gpui_macos-*.d
            target/**/deps/libgpui_windows-*
            target/**/deps/gpui_windows-*.d
            target/**/.fingerprint/gpui-pre*
            target/**/build/gpui-pre*
          key: ${{ steps.vendor.outputs.cache-primary-key }}

  # The packages as the Release workflow makes them (ad hoc signed on macOS), with the release
  # profile's dependencies cached apart from the tests' debug ones. `windows-upgrade` packages
  # for Windows.
  package:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ needs.changes.outputs.release != 'true' && 'off' || 'fat' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ needs.changes.outputs.release != 'true' && '16' || '1' }}
      # A pull request's packages only show that they build and install: compiled at opt-level 1
      # they build in less time than at the release profile's 3 (2026-11-10: the Windows build
      # took 25 to 36 minutes from cold, with no packaging cache under the 10 GB limit).
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ needs.changes.outputs.release != 'true' && '1' || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install GPUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ needs.changes.outputs.release == 'true' && 'package' || 'package-fast' }}
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask package
        env:
          # Stockfish's release check; shared runners hit GitHub's anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          # Release packages are made by the Release workflow; CI's are ad hoc signed.
          KCHESS_SIGN_IDENTITY: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gpui-${{ matrix.os }}
          path: apps/gpui/dist/
          retention-days: 14

  # The Snap as the Release workflow builds it, before a tag rather than after one (2026.10.16).
  # Not on pull requests: snapcraft fetches itself and its build snaps from the Snap Store, whose
  # outages (2026-11-06, 2026-11-10 twice: slow installs, then HTTP 503 downloads) held pull
  # requests that could not pass until it recovered. Main's nightly run, a run by hand (on any
  # branch, to test a Snap change before it merges) and release commits build it; `release.yml`
  # builds the published one.
  snap:
    needs: changes
    if: needs.changes.outputs.packaging == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/snap-build.yml
    with:
      fast: ${{ needs.changes.outputs.release != 'true' }}

  # Every way a Windows installation upgrades to this commit's installer.
  windows-upgrade:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/windows-upgrade.yml
    with:
      fast: ${{ needs.changes.outputs.release != 'true' }}

  # How many mutants a pull request's changed lines have, and so how many shards test them: none
  # when there are none (2026-11-09: 6 of 16 pull requests, whose 4 shards each spent 2 minutes
  # finding nothing), one per 15 mutants up to 8. Listing them builds nothing. A push to main
  # passes `mutants` at once, with one shard.
  mutants-plan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards || '[0]' }}
      total: ${{ steps.plan.outputs.total || '1' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # xtask's build, read only.
      - if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: mutants
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-mutants
      - if: github.event_name == 'pull_request'
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          cargo xtask mutants --plan --base "$(git merge-base "$BASE" HEAD)"
          -- --exclude 'apps/gpui/**' >> "$GITHUB_OUTPUT"

  # Mutation testing of the lines a pull request changes (`cargo xtask mutants`,
  # docs/mutation-testing.md): every change arrives with its mutants killed, while the weekly
  # Mutants workflow works through the rest. A pull request's mutants are split over the shards
  # `mutants-plan` counts, one at a time on each, so a large change takes about as long as the
  # other jobs. The app's mutants each rebuild the app, so they are the weekly run's (its `gpui`
  # job tests the week's changes to the app). A push to main passes it at once: its pull request
  # ran it, and `cargo xtask release-verify` needs every job to succeed.
  mutants:
    needs: [changes, mutants-plan]
    if: needs.changes.outputs.code == 'true' && needs.mutants-plan.outputs.shards != '[]'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    # A change whose mutants take longer than this is too large to review in one pull request.
    timeout-minutes: 30
    env:
      # A push to main keeps the mutants' dependencies built for the pull requests after it.
      WARM: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - if: github.event_name != 'pull_request' && env.WARM != 'true'
        run: echo "Mutants are tested in the pull request."
      - if: github.event_name == 'pull_request' || env.WARM == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The crates.io dependencies of every package but the app, built as cargo-mutants builds
      # them. In copies of the repository (its default) every shard compiled them all, and again
      # for its second build folder (2026-11-10: 224 crates, 288 s before the first kchess-core
      # mutant); copying `target` along still rebuilt 133, since the copies' new modification times
      # read as stale. So mutants build in place, from this. Saved by main, read by pull requests.
      - if: github.event_name == 'pull_request' || env.WARM == 'true'
        id: deps
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: mutants
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ env.WARM == 'true' }}
      - if: github.event_name == 'pull_request' || (env.WARM == 'true' && steps.deps.outputs.cache-hit != 'true')
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest,cargo-mutants
      # One package at a time, as cargo-mutants builds each mutant's package, so the features
      # each is built with are the ones a mutant of it asks for.
      - if: env.WARM == 'true' && steps.deps.outputs.cache-hit != 'true'
        name: Build the mutants' dependencies
        env:
          CARGO_INCREMENTAL: 1
        run: |
          for package in $(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r '.packages[].name | select(. != "kchess-gpui")'); do
            cargo nextest run --no-run --locked --package="$package"
          done
      # The engines `check` gives the tests, so the mutants they kill there die here too; kept as
      # `check` keeps them.
      - if: github.event_name == 'pull_request'
        id: engines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/stockfish
            target/fairy-stockfish/bin
          key: engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/kchess-core/src/engine/managed.rs', 'tooling/xtask/src/fairy.rs') }}
      - if: github.event_name == 'pull_request' && steps.engines.outputs.cache-hit != 'true'
        name: Fetch the engines
        run: cargo xtask engines --github-env "$RUNNER_TEMP/stockfish"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'pull_request' && steps.engines.outputs.cache-hit == 'true'
        name: Name the kept engines
        run: |
          echo "KCHESS_ENGINE_PATH=$RUNNER_TEMP/stockfish/stockfish" >> "$GITHUB_ENV"
          echo "KCHESS_VARIANT_ENGINE_PATH=$PWD/target/fairy-stockfish/bin/fairy-stockfish" >> "$GITHUB_ENV"
      - if: github.event_name == 'pull_request'
        name: Mutants of the changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutants-plan.outputs.total }}
          # Each mutant rebuilds its package with one small edit: incrementally, its build takes a
          # third of the time (2026-11-09, 43 kchess-domain mutants: 6.0 s against 2.1 s each, the
          # same outcomes). rust-cache turns incremental builds off for the job.
          CARGO_INCREMENTAL: 1
        run: >-
          cargo xtask mutants --base "$(git merge-base "$BASE" HEAD)"
          -- --shard "$SHARD/$SHARDS" --in-place --exclude 'apps/gpui/**'
      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-diff-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
          retention-days: 14

  # The one status check `main`'s ruleset requires: every job above passed, or was skipped because
  # its change did not need it. A skipped matrix job reports under its bare name, so the ruleset
  # cannot name the jobs themselves.
  ci-passed:
    if: always()
    needs: [changes, check, deny, gpui, headless, mutants-plan, mutants, package, snap, windows-upgrade]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
