name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GPUI_LINUX_LIBS: >-
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev
    desktop-file-utils

jobs:
  # `cargo xtask check`: format, lints, notices, release metadata and the tests under the coverage
  # gate, as the pre-push hook runs them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI build libraries
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      # Compiled Rust dependencies, restored on every run and saved only from main (the repository's
      # cache quota is shared): only KChess's own crates recompile. CI and release jobs share keys.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      # The official Stockfish, so the tests that need a real engine run (`tests/support`).
      - name: Fetch Stockfish
        run: echo "KCHESS_ENGINE_PATH=$(cargo run -q --locked -p kchess-core --example fetch_stockfish -- "$RUNNER_TEMP/stockfish")" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo xtask check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-measurements
          path: test-results/rust-coverage/summary.json
          if-no-files-found: ignore
          retention-days: 30

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # The app on each platform: its lints, its unit and end-to-end tests (`src/e2e`, headless), and
  # a preview package as the Release workflow makes them (ad hoc signed on macOS).
  gpui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p kchess-gpui -p kchess-cli -p xtask --all-targets --locked -- -D warnings
      - run: cargo test -p kchess-gpui -p kchess-cli -p xtask --locked
      - run: cargo xtask package
        env:
          # Stockfish's release check; shared runners hit GitHub's anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          # Release packages are made by the Release workflow; CI's are ad hoc signed previews.
          KCHESS_SIGN_IDENTITY: ''
      - uses: actions/upload-artifact@v7
        with:
          name: gpui-${{ matrix.os }}
          path: apps/gpui/dist/
          retention-days: 14
