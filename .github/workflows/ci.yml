name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push replaces its run; every push to main runs to the end, so each
# commit has a result (`cargo xtask release-verify` needs its release commit's).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GPUI_LINUX_LIBS: >-
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev
    desktop-file-utils

jobs:
  # Whether packaging may have changed since main last packaged (a pull request: since its base).
  # The packages, the Snap and the Windows upgrade take most of CI's time, so they run only then.
  # A release commit changes Cargo.toml, so it always runs them. Measured from the newest main
  # commit whose packaging jobs all passed (else the last release) rather than the previous push,
  # so a change keeps running them until they pass.
  #
  # Whether this push or pull request changes more than the documents nothing reads. A release
  # commit changes Cargo.toml, so `cargo xtask release-verify` never meets a skipped `check`.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.docs.outputs.code }}
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: docs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS: '^(docs/|(AGENTS|ARCHITECTURE|CONTRIBUTING|CORE_FRONTENDS|GUARDRAILS|README|RUST_MIGRATION|SECURITY)\.md$)'
        run: |
          if files="$(git diff --name-only "$BASE" HEAD)" && [ -z "$(echo "$files" | grep -vE "$DOCS")" ]; then
            code=false
          else
            code=true
          fi
          echo "Code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - id: packaged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list --workflow ci.yml --branch main --event push --status success --limit 30 \
              --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"'); do
            sha="${run#*:}"
            [ "$sha" = "$GITHUB_SHA" ] && continue
            git merge-base --is-ancestor "$sha" HEAD 2>/dev/null || continue
            if gh run view "${run%%:*}" --json jobs --jq '[.jobs[] | select(.name | test("^(package |snap|windows-upgrade)")) | .conclusion] | length > 0 and all(. == "success")' | grep -qx true; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || steps.packaged.outputs.sha }}
          PACKAGING: '^(Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/|apps/gpui/build\.rs$|apps/gpui/build/|apps/electron-bridge/|crates/kchess-voice/|tooling/xtask/src/(package/|voice\.rs$|licenses\.rs$)|tooling/windows-upgrade-test\.ps1$|\.github/actions/|\.github/workflows/(ci|release|snap-build|windows-upgrade)\.yml$)'
        run: |
          base="${BASE:-$(git describe --tags --abbrev=0 --match 'v2*' HEAD 2>/dev/null || true)}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -qE "$PACKAGING"; then
            packaging=true
          else
            packaging=false
          fi
          echo "Packaging changed since ${base:-the start}: $packaging"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  # `cargo xtask check`: format, lints, notices, release metadata and the tests under the coverage
  # gate, as the pre-push hook runs them. This is also the app's lints and tests on Linux.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI build libraries
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      # Compiled Rust dependencies, restored on every run and saved only from main (the repository's
      # cache quota is shared): only KChess's own crates recompile. CI and release jobs share keys.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      # The official Stockfish, so the tests that need a real engine run (`tests/support`).
      - name: Fetch Stockfish
        run: echo "KCHESS_ENGINE_PATH=$(cargo run -q --locked -p kchess-core --example fetch_stockfish -- "$RUNNER_TEMP/stockfish")" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo xtask check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-measurements
          path: test-results/rust-coverage/summary.json
          if-no-files-found: ignore
          retention-days: 30

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # The app on the other platforms: its lints and its unit and end-to-end tests (`src/e2e`,
  # headless). `check` runs them on Linux.
  gpui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p kchess-gpui -p kchess-cli -p xtask --all-targets --locked -- -D warnings
      - run: cargo test -p kchess-gpui -p kchess-cli -p xtask --locked

  # The packages as the Release workflow makes them (ad hoc signed on macOS), with the release
  # profile's dependencies cached apart from the tests' debug ones. `windows-upgrade` packages
  # for Windows.
  package:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-fast
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask package
        env:
          # Stockfish's release check; shared runners hit GitHub's anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          # Release packages are made by the Release workflow; CI's are ad hoc signed.
          KCHESS_SIGN_IDENTITY: ''
      - uses: actions/upload-artifact@v7
        with:
          name: gpui-${{ matrix.os }}
          path: apps/gpui/dist/
          retention-days: 14

  # The Snap as the Release workflow builds it, before a tag rather than after one (2026.10.16).
  snap:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/snap-build.yml
    with:
      fast: true

  # Every way a Windows installation upgrades to this commit's installer.
  windows-upgrade:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/windows-upgrade.yml
