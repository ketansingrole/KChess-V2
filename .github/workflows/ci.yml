name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Nightly: main's packages, Snap and Windows upgrade, when packaging changed since main last
  # packaged (`changes`); the rest of CI ran on each push. By hand: package main now.
  schedule:
    - cron: '17 2 * * *'
  # By hand, or with `base` the Dependabot hack workflow's run after it commits to a Dependabot pull
  # request: its push by GITHUB_TOKEN starts no `pull_request` run.
  workflow_dispatch:
    inputs:
      base:
        description: Test the branch as a pull request onto this commit, rather than package it.
        type: string
        default: ''

permissions:
  contents: read

# A pull request's newer push replaces its run; every run on main runs to the end, so each
# commit has a result (`cargo xtask release-verify` needs its release commit's).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `.config/nextest.toml`: report every failure of the run, not only the first.
  NEXTEST_PROFILE: ci

jobs:
  # Each job has a time limit about twice its slowest green run (2026-11: 25 min for the app's
  # tests on macOS and Windows), so a hung step fails within the hour instead of GitHub's six.
  # Whether to package. The packages, the Snap and the Windows upgrade take most of CI's time
  # (2026-11-09: 20 to 30 minutes on a push to main), so they run only for
  # - a pull request whose change may touch packaging (since its base): it packages before it lands;
  # - a release commit: it changes Cargo.toml's version, and is the commit the tag will build;
  # - the nightly run, when packaging may have changed since main last packaged: measured from the
  #   newest main commit whose packaging jobs all passed (else the last release), so a change keeps
  #   running them each night until they pass. A push to main does not: its pull request packaged.
  # - a run started by hand, always; with a `base`, as a pull request onto it.
  #
  # Whether this push or pull request changes more than the documents nothing reads. A release
  # commit changes Cargo.toml, so `cargo xtask release-verify` never meets a skipped `check`.
  #
  # Whether this is a release commit. Only those package with the release profile's fat LTO, whose
  # link takes over half of a package job: their run tests what the tag will build, and saves the
  # dependencies the Release workflow restores.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The nightly run's base (`gh run list`), and the drop-caches action.
      actions: write
    outputs:
      code: ${{ steps.docs.outputs.code }}
      release: ${{ steps.docs.outputs.release }}
      # Whether this run tests a pull request (or a branch dispatched as one), and onto which commit.
      pr: ${{ steps.docs.outputs.pr }}
      base: ${{ steps.docs.outputs.base }}
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # `xtask scope` says which files run what (tooling/xtask/src/check.rs). It reads only git, so
      # xtask's program is all this job needs, kept by the sources it is built from
      # (`workflows::xtask_program_is_keyed_by_its_sources`): every job waits for this one, and
      # restoring the 839 MB check cache and the toolchain to build it took 26 of its 36 seconds
      # (2026-11-20). A change to them builds it from the check cache, read only.
      - id: xtask
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/xtask
          key: xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tooling/xtask/**', 'crates/kchess-delta/**', 'crates/kchess-hack/**', 'crates/kchess-host/**', 'crates/kchess-testkit/**', 'crates/kchess-voice/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: ./.github/actions/rust-cache
        with:
          shared-key: check
          save-if: false
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: cargo build -p xtask --locked
      - if: steps.xtask.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/drop-caches
        with:
          prefix: xtask-${{ runner.os }}-${{ runner.arch }}-
      - if: steps.xtask.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - id: docs
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$PR_BASE" ]; then
            pr=true
            # A dispatched branch is not merged onto its base: compare from where it left it.
            [ "$EVENT" != workflow_dispatch ] || BASE="$(git merge-base "$PR_BASE" HEAD)"
          else
            pr=false
          fi
          echo "Pull request: $pr${PR_BASE:+ onto $BASE}"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          [ "$pr" = false ] || echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # The nightly and by-hand runs only package: each push to main ran the rest.
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$pr" = false ]; }; then
            code=false
          elif scope="$(target/debug/xtask scope "$BASE")"; then
            code="$(echo "$scope" | sed -n 's/^code=//p')"
          else
            code=true
          fi
          echo "Code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ] && git diff "$BASE" HEAD -- Cargo.toml | grep -q '^+version = '; then
            release=true
          else
            release=false
          fi
          echo "Release commit: $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # The packaging jobs by their names (`package (<os>)`, which packs the Snap on Linux, and
      # `windows-upgrade / …`): renaming one of them needs this pattern changed too.
      # The nightly run's base: the newest main commit, this one included, that a push or nightly
      # run packaged.
      - id: packaged
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list --workflow ci.yml --branch main --status success --limit 60 \
              --json databaseId,headSha,event --jq '.[] | select(.event == "push" or .event == "schedule") | "\(.databaseId):\(.headSha)"'); do
            sha="${run#*:}"
            git merge-base --is-ancestor "$sha" HEAD 2>/dev/null || continue
            if gh run view "${run%%:*}" --json jobs --jq '[.jobs[] | select(.name | test("^(package |windows-upgrade)")) | .conclusion] | length > 0 and all(. == "success")' | grep -qx true; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - id: diff
        env:
          BASE: ${{ steps.docs.outputs.base || steps.packaged.outputs.sha }}
          EVENT: ${{ github.event_name }}
          PR: ${{ steps.docs.outputs.pr }}
          RELEASE: ${{ steps.docs.outputs.release }}
        run: |
          if [ "$RELEASE" = true ] || { [ "$EVENT" = workflow_dispatch ] && [ "$PR" = false ]; }; then
            packaging=true
            echo "Packaging: a release commit or a run by hand"
          elif [ "$EVENT" = push ]; then
            packaging=false
            echo "Packaging: not on a push to main (its pull request packaged; the nightly run packages main)"
          else
            base="${BASE:-$(git describe --tags --abbrev=0 --match 'v2*' HEAD 2>/dev/null || true)}"
            if [ -z "$base" ] || ! scope="$(target/debug/xtask scope "$base")"; then
              packaging=true
            else
              packaging="$(echo "$scope" | sed -n 's/^packaging=//p')"
            fi
            echo "Packaging changed since ${base:-the start}: $packaging"
          fi
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  # `cargo xtask check`: format, lints, notices, release metadata and the tests under the coverage
  # gate, as the pre-push hook runs them, but the app's and its UI crates' tests, which `gpui` runs
  # on Linux beside it (2026-11-09: 6 of check's 12 minutes; 2026-11-19, once the UI crates left the
  # app: building GPUI uninstrumented again for theirs took 2 min 45 s with a warm cache and 7 min
  # 38 s without). This is also the app's lints on Linux.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The drop-caches action.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-gpui-libs
      # Compiled Rust dependencies, restored on every run and saved only from main (the repository's
      # cache quota is shared): only KChess's own crates recompile. CI and release jobs share keys.
      # Each job that saves one drops the cache it replaces first (`.github/actions/drop-caches`).
      # Keyed by the pinned toolchain, Cargo's variables and the lockfile (`.github/actions/rust-cache`).
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-hakari: `cargo xtask check` refuses a workspace hack that it would write differently.
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-llvm-cov,cargo-nextest,cargo-hakari
      - uses: ./.github/actions/engines
      - run: cargo xtask check --without-app-tests
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/drop-caches
        with:
          rust-cache: check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: check-measurements
          path: test-results/rust-coverage/summary.json
          if-no-files-found: ignore
          retention-days: 30

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-deny
      - run: cargo deny check
      # The fuzz workspace has its own lock file.
      - run: cargo deny --manifest-path fuzz/Cargo.toml check

  # Every workflow and action against GitHub's own rules, as GitHub reads them on a push: an empty
  # `env:` in release.yml made GitHub refuse the file, and 48 pushes from 2026-11-09 to 11-15 failed
  # a Release run before a tag would have found it. xtask's `workflows` tests check the scripts.
  workflows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # actionlint's own release, pinned by version and checksum: install-action has no manifest
      # for it, and fell back to cargo-binstall, which found no crate.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The scripts' shell is checked by xtask (`every_workflow_step_parses_in_bash`).
      - run: actionlint -color -shellcheck= -pyflakes=
      # Their security, as Zed audits its own: an event's text expanded into a script, a token
      # with more permissions than its job uses, credentials left in a checkout, an action not
      # pinned to a commit. Offline, so it reads only this repository; what it accepts on purpose
      # is in `.github/zizmor.yml`, each with its reason.
      - uses: ./.github/actions/install-tools
        with:
          tools: zizmor
      - run: zizmor --offline --format=github .github

  # Spelling in code, comments, documents and the app's text (`_typos.toml`), as Zed and GPUI Kit
  # check theirs. It runs on documents-only changes too: they are most of what it reads.
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tools
        with:
          tools: typos
      - run: typos

  # The app's unit and end-to-end tests (`src/e2e`, headless) on every platform; `headless` runs
  # the rest beside it on Windows, the workspace's lints included. On macOS this job runs them
  # itself, after the app's tests: GitHub runs short of macOS arm64 runners (2026-11-11: jobs
  # cancelled after 15 minutes waiting for one), and the app's tests and these (2026-11-11: 3 to 5
  # minutes each, a minute of it setup) still end before Windows `headless` (7 to 9 minutes).
  gpui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      # The drop-caches action.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-gpui-libs
      - uses: ./.github/actions/windows-linker
      # On macOS it holds the lints' and the command line's builds too.
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # On macOS the lint build too (below), so its name tells it from a cache without one.
      - id: vendor
        uses: ./.github/actions/vendor-gpui
        with:
          name: vendor-gpui-v2${{ runner.os == 'macOS' && '-lint' || '' }}
      # The app's tests under `cargo test`: each starts GPUI, so a process per test (nextest) is slower.
      # They mostly wait on the app's timers and tasks (2026-11-09, three threads: 57 s of CPU in
      # 320 s), so more threads than the runners' 3 or 4 cores finish them sooner. Not on Windows:
      # eight at once starved its runner until the tests' own local servers timed out (2026-11-10,
      # two runs of five, each a different test).
      - run: cargo test -p kchess-gpui --locked
        env:
          RUST_TEST_THREADS: ${{ runner.os == 'Windows' && 4 || 8 }}
      # The UI crates' tests on Linux, on the GPUI build above: `check` leaves them here
      # (`--without-app-tests`). `headless` runs them on Windows and the step below on macOS.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest
      - if: runner.os == 'Linux'
        run: cargo xtask ui-tests
      # What `headless` runs on Windows, here for macOS: one runner fewer per run.
      - if: runner.os == 'macOS'
        uses: ./.github/actions/headless-tests
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/drop-caches
        with:
          rust-cache: gpui
      - uses: ./.github/actions/vendor-gpui
        with:
          name: vendor-gpui-v2${{ runner.os == 'macOS' && '-lint' || '' }}
          save: true
          restored: ${{ steps.vendor.outputs.restored }}
          rust-cache-hit: ${{ steps.cache.outputs.cache-hit }}

  # Everything else on Windows, beside `gpui` rather than after it: the workspace's lints (`check`
  # lints it on Linux, the macOS `gpui` job its macOS code; here its Windows code) and every
  # member's tests but the app's, which `check` runs on Linux; here they keep building and passing
  # on Windows: named pipes, CRLF checkouts, Unix-only test helpers, the updater's patches, the
  # speech helper's MinGW libvosk. The whole workspace, so a new member is tested without naming it.
  headless:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      # The drop-caches action.
      actions: write
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-linker
      # A cache of its own, saved from main. It restored the gpui job's, which holds no lint
      # build: clippy checked all 470 dependencies again on every run, 3.5 of the job's 13 minutes
      # (run 44761306490), on CI's longest job. It costs about 700 MB of the repository's 10 GB,
      # which the mutation tests' cache gave back.
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: headless
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The vendored GPUI's lint build, kept as the gpui job keeps its test build.
      - id: vendor
        uses: ./.github/actions/vendor-gpui
        with:
          name: vendor-headless
      - uses: ./.github/actions/headless-tests
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/drop-caches
        with:
          rust-cache: headless
      - uses: ./.github/actions/vendor-gpui
        with:
          name: vendor-headless
          save: true
          restored: ${{ steps.vendor.outputs.restored }}
          rust-cache-hit: ${{ steps.cache.outputs.cache-hit }}

  # The packages as the Release workflow makes them (ad hoc signed on macOS), with the release
  # profile's dependencies cached apart from the tests' debug ones. `windows-upgrade` packages
  # for Windows. Linux packs the Snap from the same build, on Ubuntu 24.04 as the Release
  # workflow does: the Snap's core24 base (ubuntu-latest is 26.04).
  package:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    permissions:
      contents: read
      # The drop-caches action.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ needs.changes.outputs.release != 'true' && 'off' || 'fat' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ needs.changes.outputs.release != 'true' && '16' || '1' }}
      # A pull request's packages only show that they build and install: compiled at opt-level 1
      # they build in less time than at the release profile's 3 (2026-11-10: the Windows build
      # took 25 to 36 minutes from cold, with no packaging cache under the 10 GB limit).
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ needs.changes.outputs.release != 'true' && '1' || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-gpui-libs
      # Saved even when the Snap fails after the build: the Snap Store's outages
      # (2026-11-06, 2026-11-10 twice) would otherwise keep the Linux build out of the cache.
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: ${{ needs.changes.outputs.release == 'true' && 'package' || 'package-fast' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo xtask package
        env:
          # Stockfish's release check; shared runners hit GitHub's anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          # Release packages are made by the Release workflow; CI's are ad hoc signed.
          KCHESS_SIGN_IDENTITY: ''
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/drop-caches
        with:
          rust-cache: ${{ needs.changes.outputs.release == 'true' && 'package' || 'package-fast' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gpui-${{ matrix.os }}
          path: apps/gpui/dist/
          retention-days: 14
      # The Snap as the Release workflow builds it, before a tag rather than after one (2026.10.16).
      # Not on pull requests: snapcraft fetches itself and its build snaps from the Snap Store,
      # whose outages (2026-11-06, 2026-11-10 twice: slow installs, then HTTP 503 downloads) held
      # pull requests that could not pass until it recovered. Main's nightly run, a run by hand (on
      # any branch, to test a Snap change before it merges) and release commits build it;
      # `release.yml` builds the published one.
      - if: runner.os == 'Linux' && needs.changes.outputs.pr != 'true'
        uses: ./.github/actions/snap

  # The package caches, for the pull requests that package: built as `cargo xtask package` builds
  # (`--build-only`), by main's nightly run when it does not package (the package jobs save their
  # own when it does). Only packaging runs read them, so the cache limit evicted them first: none
  # was left on 2026-11-10, and every packaging pull request compiled from cold (Windows 1,224 s,
  # macOS 900 s, Linux 743 s). A cache still there costs a restore, which keeps it recently used.
  package-cache:
    needs: changes
    if: github.event_name == 'schedule' && needs.changes.outputs.packaging != 'true'
    permissions:
      contents: read
      # The drop-caches action.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # As the package jobs and `windows-upgrade` build a pull request's, so the keys are theirs.
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-gpui-libs
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: package-fast
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask package --build-only
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/drop-caches
        with:
          rust-cache: package-fast

  # Every way a Windows installation upgrades to this commit's installer.
  windows-upgrade:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    permissions:
      contents: read
      # Its build job's drop-caches action.
      actions: write
    uses: ./.github/workflows/windows-upgrade.yml
    with:
      fast: ${{ needs.changes.outputs.release != 'true' }}

  # The one status check `main`'s ruleset requires: every job above passed, or was skipped because
  # its change did not need it. A skipped matrix job reports under its bare name, so the ruleset
  # cannot name the jobs themselves.
  ci-passed:
    if: always()
    needs: [changes, check, deny, workflows, typos, gpui, headless, package, package-cache, windows-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # A scheduled run's failure opens an issue, and its next pass closes it (.github/actions/scheduled-report).
  report:
    needs: [ci-passed]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/scheduled-report
        with:
          name: Nightly CI
          failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
