name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Report guardrail measurements
        if: always()
        run: pnpm run check:report
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-measurements
          path: |
            test-results/guardrails/
            test-results/unit.xml
            test-results/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 30

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory-only: several flagged packages have no patched release upstream
      # (tracked in docs/reviews/2026-10-03-implementation.md), so a blocking
      # audit would fail every build. Revisit once patches are published.
      - name: Dependency audit (informational)
        continue-on-error: true
        run: pnpm audit --audit-level moderate

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:puzzle-worker
      # Windows Server runners deny microphone access in privacy settings, which the app
      # (correctly) reports as "denied". Allow it so the voice e2e test can run.
      - name: Allow microphone access (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone',
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone',
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged'
          )
          foreach ($p in $paths) {
            New-Item -Path $p -Force | Out-Null
            Set-ItemProperty -Path $p -Name Value -Value Allow
          }
      - run: pnpm run test:e2e
        if: runner.os != 'Linux'
      - run: xvfb-run --auto-servernum pnpm run test:e2e
        if: runner.os == 'Linux'
      - name: Package and verify contents
        run: pnpm exec electron-builder --dir --publish never
      - run: pnpm run test:packaged
        if: runner.os != 'Linux'
      - run: xvfb-run --auto-servernum pnpm run test:packaged
        if: runner.os == 'Linux'
      - name: Report guardrail measurements
        if: always()
        run: pnpm run check:report
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-measurements-${{ matrix.os }}
          path: |
            test-results/guardrails/
            test-results/desktop*.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-failure-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
