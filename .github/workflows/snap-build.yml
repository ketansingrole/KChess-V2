name: Snap build

# The Snap Store's KChess, built in LXD from the same app: by CI when packaging may have changed,
# and by the Release workflow, which attaches it to the draft; the store publishes it from the
# published release (snap-publish.yml).
on:
  workflow_call:
    inputs:
      # Without the release profile's fat LTO (ci.yml).
      fast:
        type: boolean
        default: false

permissions:
  contents: read

env:
  GPUI_LINUX_LIBS: >-
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev
    desktop-file-utils

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.fast && 'off' || 'fat' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.fast && '16' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install GPUI build libraries
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ inputs.fast && 'package-fast' || 'package' }}
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      # Packed on the runner itself, an Ubuntu 24.04 like the Snap's core24 base: snapcraft only
      # dumps the built app and its stage packages into it (`cargo xtask package --snap`). Its
      # LXD build instance downloaded Ubuntu's image every run (2026-11-10: 21 minutes).
      - run: sudo snap install snapcraft --classic
      - name: Build the Snap
        run: cargo xtask package --snap
        env:
          GH_TOKEN: ${{ github.token }}
          KCHESS_SNAP_DESTRUCTIVE: '1'
      # snapcraft ran as root, so its logs are root's.
      - if: failure()
        run: sudo cp -r /root/.local/state/snapcraft/log snapcraft-log && sudo chown -R "$USER" snapcraft-log
      - name: Retain Snap build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snap-build-diagnostics
          path: |
            snapcraft-log/
            target/package/stage/snap/snap/snapcraft.yaml
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kchess-snap
          path: apps/gpui/dist/*.snap
          if-no-files-found: error
          retention-days: 14
