name: Snap build

# The Snap Store's KChess, built in LXD from the same app: by CI when packaging may have changed,
# and by the Release workflow, which attaches it to the draft; the store publishes it from the
# published release (snap-publish.yml).
on:
  workflow_call:
    inputs:
      # Without the release profile's fat LTO (ci.yml).
      fast:
        type: boolean
        default: false

permissions:
  contents: read

env:
  GPUI_LINUX_LIBS: >-
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev
    desktop-file-utils

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.fast && 'off' || 'fat' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.fast && '16' || '1' }}
      # A pull request's packages only show that they build and install: compiled at opt-level 1
      # they build in less time than at the release profile's 3 (2026-11-10: the Windows build
      # took 25 to 36 minutes from cold, with no packaging cache under the 10 GB limit).
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ inputs.fast && '1' || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install GPUI build libraries
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ inputs.fast && 'package-fast' || 'package' }}
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      # Packed on the runner itself, an Ubuntu 24.04 like the Snap's core24 base: snapcraft only
      # dumps the built app and its stage packages into it (`cargo xtask package --snap`). Its
      # LXD build instance downloaded Ubuntu's image every run: 1.5 minutes as a rule.
      - run: sudo snap install snapcraft --classic
      - name: Build the Snap
        run: cargo xtask package --snap
        env:
          GH_TOKEN: ${{ github.token }}
          KCHESS_SNAP_DESTRUCTIVE: '1'
      # snapcraft keeps none of the output of the `snap install`s it runs, so a Store problem left
      # only "Error installing snap" (2026-11-10). snapd's own account of each install, its tasks
      # with their times (download, mount, setup), goes in the job log of every build, slow ones
      # that pass included; with snapd's journal, it joins a failed build's diagnostics.
      - name: Show snapd's installs
        if: always()
        run: |
          mkdir -p snapcraft-log/snapd
          cd snapcraft-log/snapd
          snap version > version.txt 2>&1 || true
          snap changes 2>&1 | tee changes.txt || true
          for change in $(snap changes 2>/dev/null | awk 'NR > 1 && $1 ~ /^[0-9]+$/ {print $1}'); do
            snap tasks "$change" 2>&1 | tee "tasks-$change.txt" || true
          done
          snap debug connectivity > connectivity.txt 2>&1 || true
          sudo journalctl -u snapd --no-pager -o short-iso > journal.txt 2>&1 || true
      # snapcraft ran as root, so its logs are root's.
      - if: failure()
        run: sudo cp -r /root/.local/state/snapcraft/log/. snapcraft-log/ && sudo chown -R "$USER" snapcraft-log
      - name: Retain Snap build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snap-build-diagnostics
          path: |
            snapcraft-log/
            target/package/stage/snap/snap/snapcraft.yaml
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kchess-snap
          path: apps/gpui/dist/*.snap
          if-no-files-found: error
          retention-days: 14
