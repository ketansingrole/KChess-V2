name: Site

# Publishes the landing page (site/) to GitHub Pages: when the page changes on main, and when a
# release is published so its download links point at the new version. The page is plain HTML and
# CSS; this job only fills in `{{version}}` and copies the app icon beside it.
#
# The github-pages environment deploys only from main, and a release event runs on its tag, so a
# published release starts this workflow again on main rather than deploying from the tag.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - apps/gpui/build/icon.svg
      - apps/gpui/build/icon.png
      - .github/workflows/site.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Build the page from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fill in the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `gh release view` with no tag is the latest published, non-prerelease release.
          tag="$(gh release view --json tagName --jq .tagName)"
          version="${tag#v}"
          echo "Latest release: $version"
          # Every link the page makes must exist, or the page would offer a broken download.
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for name in \
              "KChess-$version-mac-arm64.dmg" "KChess-$version-mac-arm64.zip" \
              "KChess-$version-win-x64.exe" "KChess-$version-linux-x86_64.AppImage" \
              "KChess-$version-linux-amd64.deb" SHA256SUMS.txt; do
            grep -qxF "$name" <<<"$assets" || { echo "::error::$tag has no $name"; exit 1; }
          done
          mkdir _site
          cp -R site/. _site/
          cp apps/gpui/build/icon.svg apps/gpui/build/icon.png _site/
          sed -i "s/{{version}}/$version/g" _site/index.html
          if grep -q '{{' _site/index.html; then
            echo "::error::site/index.html has a placeholder this job does not fill"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
