name: Release

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) to build installers for macOS,
# Windows and Linux and attach them to a draft GitHub Release, which you then publish by hand.
# "Run workflow" in the Actions tab builds the same installers as downloads, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner; the Intel (x64) build is cross-packaged there.
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates: never look for one in a keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.platform }} --config scripts/release-config.cjs --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: kchess-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Add checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS.txt
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run replaces the files on the existing draft instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* --draft --generate-notes \
              --title "KChess ${GITHUB_REF_NAME#v}"
          fi
