name: Release

# Versions are YEAR.MONTH.COUNTER (v2026.10.0, v2026.10.1, … v2026.11.0); `cargo xtask
# release-version` sets the next one in Cargo.toml. Push the matching tag to build installers for
# macOS, Windows and Linux and attach them to a draft GitHub Release, which you then publish by
# hand. "Run workflow" in the Actions tab builds the same installers as downloads, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GPUI_LINUX_LIBS: >-
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The workspace includes the app, which builds against these system headers.
      - name: Install GPUI build libraries
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - name: Verify release metadata
        run: cargo xtask release-verify
      - name: Verify the release commit belongs to main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - run: cargo xtask check

  # KChess for every platform in both identities: `final` is the app every KChess installation
  # runs, with the update manifests the Electron app's updater reads (`latest*.yml`), so it installs
  # this over itself; `preview` keeps "KChess Preview" installations updating. Signed and notarized
  # on macOS with the Developer ID when its secrets are set, ad hoc otherwise.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
        identity: [final, preview]
    runs-on: ${{ matrix.os }}
    env:
      KCHESS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
      # The packages' name, and the Mac app's.
      PACKAGE_PREFIX: ${{ matrix.identity == 'final' && 'KChess' || 'KChess-Preview' }}
      APP_NAME: ${{ matrix.identity == 'final' && 'KChess' || 'KChess Preview' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The packager signs with codesign directly, so the certificate goes into a keychain of this
      # job's own, and the identity is named by its hash.
      - name: Import the Developer ID certificate
        id: mac-signing
        if: runner.os == 'macOS' && env.KCHESS_MAC_SIGNING == 'true'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/kchess-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/kchess-signing.p12"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/ { print $2; exit }')"
          test -n "$identity" || { echo "::error::No Developer ID Application identity in MAC_CSC_LINK."; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - run: cargo xtask package ${{ matrix.identity == 'final' && '--final' || '' }}
        env:
          # Stockfish's release check; shared runners hit GitHub's anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          KCHESS_SIGN_IDENTITY: ${{ steps.mac-signing.outputs.identity }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify Mac signing and notarization
        if: runner.os == 'macOS' && env.KCHESS_MAC_SIGNING == 'true'
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The app as the updater and a download receive it: from the zip that ships.
          unpacked="$RUNNER_TEMP/kchess-zip"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          ditto -x -k apps/gpui/dist/"$PACKAGE_PREFIX"-*-mac-arm64.zip "$unpacked"
          mac_app="$unpacked/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$mac_app"
          signing_team="$(codesign --display --verbose=4 "$mac_app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$signing_team" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::$APP_NAME's signing team does not match APPLE_TEAM_ID."
            exit 1
          fi
          spctl --assess --type execute --verbose=2 "$mac_app"
          xcrun stapler validate "$mac_app"
      - name: Verify every supported package exists
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) manifest=latest-mac.yml; packages="$PACKAGE_PREFIX-*-mac-arm64.dmg $PACKAGE_PREFIX-*-mac-arm64.zip" ;;
            Windows) manifest=latest.yml; packages="$PACKAGE_PREFIX-*-win-x64.exe" ;;
            Linux) manifest=latest-linux.yml; packages="$PACKAGE_PREFIX-*-linux-x86_64.AppImage $PACKAGE_PREFIX-*-linux-amd64.deb" ;;
          esac
          for pattern in $packages; do
            found=$(find apps/gpui/dist -maxdepth 1 -name "$pattern" -size +0 | head -n 1)
            test -n "$found" || { echo "::error::Missing package: $pattern"; exit 1; }
          done
          if [ "${{ matrix.identity }}" = final ]; then
            # The Electron app's updater finds the app replacing it through these.
            test -s "apps/gpui/dist/$manifest" || { echo "::error::Missing update metadata: $manifest"; exit 1; }
          elif ls apps/gpui/dist/latest*.yml >/dev/null 2>&1; then
            # The preview must never carry manifests an installed KChess would read as its own.
            echo "::error::The preview wrote update manifests."; exit 1
          fi
      # The release job writes one SHA256SUMS.txt for every package.
      - uses: actions/upload-artifact@v7
        with:
          name: kchess-${{ runner.os }}-${{ matrix.identity }}
          path: |
            apps/gpui/dist/*
            !apps/gpui/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # The Snap Store's KChess, built in LXD from the same app; the store publishes it from the
  # published release (snap-publish.yml).
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI build libraries
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - name: Prepare isolated Snap build environment
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          # Docker's forwarding policy on hosted runners can block the LXD bridge.
          # Permit build-container egress and established replies on that bridge only.
          if sudo iptables -nL DOCKER-USER >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
      - name: Build the Snap
        run: sg lxd -c 'cargo xtask package --final --snap'
        env:
          GH_TOKEN: ${{ github.token }}
          KCHESS_SNAP_LXD: '1'
      - name: Retain Snap build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snap-build-diagnostics
          path: |
            ~/.local/state/snapcraft/log/
            target/package/stage/snap/snap/snapcraft.yaml
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: kchess-snap
          path: apps/gpui/dist/*.snap
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [validate, package, snap]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Add checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS.txt
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cargo xtask attach-draft-release packages
