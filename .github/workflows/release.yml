name: Release

# Versions are YEAR.MONTH.COUNTER (v2026.10.0, v2026.10.1, … v2026.11.0); `pnpm run release:version`
# sets the next one in package.json. Push the matching tag to build installers for macOS,
# Windows and Linux and attach them to a draft GitHub Release, which you then publish by hand.
# "Run workflow" in the Actions tab builds the same installers as downloads, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GPUI_LINUX_LIBS: >-
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev

jobs:
  validate:
    runs-on: ubuntu-latest
    # Unpackaged test builds use thin LTO and parallel codegen: the same code, compiled faster.
    # Jobs that package (desktop, release package) keep Cargo.toml's profile for real sizes.
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: pnpm run release:verify
      - name: Verify the release commit belongs to main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      # Compiled Rust dependencies, restored on every run and saved only from main (the repository's
      # cache quota is shared): only KChess's own crates recompile. CI and release jobs share keys.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Rust coverage gate (`check:rust-coverage`) runs inside `pnpm run check`.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - run: pnpm run check

  # Packaging runs alongside validation rather than after it; the draft release waits for both,
  # so a failing check still stops it.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS releases support Apple Silicon only.
          - os: macos-latest
            platform: --mac --arm64
          - os: windows-latest
            platform: --win
          - os: ubuntu-24.04
            platform: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Certificates are imported explicitly; never use an unrelated keychain identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      KCHESS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Compiled Rust dependencies, restored on every run and saved only from main (the repository's
      # cache quota is shared): only KChess's own crates recompile. CI and release jobs share keys.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm run build
      # afterPack rejects nested installers/apps, redundant dependencies, and oversized payloads.
      - name: Build installers and verify package contents
        run: pnpm exec electron-builder --projectDir apps/desktop ${{ matrix.platform }} --config ../../tooling/release-config.cjs --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Prepare isolated Snap build environment
        if: runner.os == 'Linux'
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          # Docker's forwarding policy on hosted runners can block the LXD bridge.
          # Permit build-container egress and established replies on that bridge only.
          if sudo iptables -nL DOCKER-USER >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
      - name: Build Snap package
        if: runner.os == 'Linux'
        run: sg lxd -c 'pnpm exec electron-builder --projectDir apps/desktop --linux snap --x64 --config ../../tooling/snap-config.cjs --publish never'
      - name: Retain Snap build diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: snap-build-diagnostics
          path: |
            ~/.local/state/snapcraft/log/
            dist/__snap-amd64/snap/snapcraft.yaml
          retention-days: 7
      - name: Verify Mac signing and notarization
        if: runner.os == 'macOS' && env.KCHESS_MAC_SIGNING == 'true'
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mac_app=dist/mac-arm64/KChess.app
          codesign --verify --deep --strict --verbose=2 "$mac_app"
          signing_team="$(codesign --display --verbose=4 "$mac_app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$signing_team" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::The app's signing team does not match APPLE_TEAM_ID."
            exit 1
          fi
          spctl --assess --type execute --verbose=2 "$mac_app"
          xcrun stapler validate "$mac_app"
      - name: Verify update metadata and every supported package exist
        shell: bash
        run: |
          # upload-artifact fails only when no pattern matches at all; check each package.
          case "${{ runner.os }}" in
            macOS) manifest=dist/latest-mac.yml; packages="*-mac-arm64.dmg *-mac-arm64.zip" ;;
            Windows) manifest=dist/latest.yml; packages="*-win-x64.exe" ;;
            Linux) manifest=dist/latest-linux.yml; packages="*.AppImage *.deb" ;;
          esac
          test -s "$manifest" || { echo "::error::Missing update metadata: $manifest"; exit 1; }
          for pattern in $packages; do
            found=$(find dist -maxdepth 1 -name "$pattern" -size +0 | head -n 1)
            test -n "$found" || { echo "::error::Missing package: dist/$pattern"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: kchess-${{ runner.os }}
          path: |
            dist/*-mac-arm64.dmg
            dist/*-mac-arm64.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest*.yml
            dist/*-mac-arm64.*.blockmap
            dist/*.exe.blockmap
            dist/*.AppImage.blockmap
          if-no-files-found: error
          retention-days: 14

  # The GPUI preview ("KChess Preview", beside the Electron app) in the same formats, which its
  # updater installs from the release (apps/gpui/src/updates.rs). Signed and notarized on macOS
  # with the Electron app's Developer ID when its secrets are set, ad hoc otherwise.
  gpui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      KCHESS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install GPUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # gpui-package.mjs signs with codesign directly, so the certificate goes into a keychain of
      # this job's own, and the identity is named by its hash.
      - name: Import the Developer ID certificate
        id: mac-signing
        if: runner.os == 'macOS' && env.KCHESS_MAC_SIGNING == 'true'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/kchess-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/kchess-signing.p12"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/ { print $2; exit }')"
          test -n "$identity" || { echo "::error::No Developer ID Application identity in MAC_CSC_LINK."; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - run: node tooling/gpui-package.mjs
        env:
          # Stockfish's release check; shared runners hit GitHub's anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          KCHESS_SIGN_IDENTITY: ${{ steps.mac-signing.outputs.identity }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify Mac signing and notarization
        if: runner.os == 'macOS' && env.KCHESS_MAC_SIGNING == 'true'
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The app as the updater and a download receive it: from the zip that ships.
          unpacked="$RUNNER_TEMP/kchess-preview-zip"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          ditto -x -k apps/gpui/dist/KChess-Preview-*-mac-arm64.zip "$unpacked"
          mac_app="$unpacked/KChess Preview.app"
          codesign --verify --deep --strict --verbose=2 "$mac_app"
          signing_team="$(codesign --display --verbose=4 "$mac_app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$signing_team" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::The preview's signing team does not match APPLE_TEAM_ID."
            exit 1
          fi
          spctl --assess --type execute --verbose=2 "$mac_app"
          xcrun stapler validate "$mac_app"
      - name: Verify every supported package exists
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) packages="KChess-Preview-*-mac-arm64.dmg KChess-Preview-*-mac-arm64.zip" ;;
            Windows) packages="KChess-Preview-*-win-x64.exe" ;;
            Linux) packages="KChess-Preview-*-linux-x86_64.AppImage KChess-Preview-*-linux-amd64.deb" ;;
          esac
          for pattern in $packages; do
            found=$(find apps/gpui/dist -maxdepth 1 -name "$pattern" -size +0 | head -n 1)
            test -n "$found" || { echo "::error::Missing package: $pattern"; exit 1; }
          done
          # The preview must never carry manifests Electron's updater would read as its own.
          if ls apps/gpui/dist/latest*.yml >/dev/null 2>&1; then
            echo "::error::The preview wrote update manifests."; exit 1
          fi
      # The release job writes one SHA256SUMS.txt for every package.
      - uses: actions/upload-artifact@v7
        with:
          name: gpui-${{ runner.os }}
          path: |
            apps/gpui/dist/*
            !apps/gpui/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [validate, package, gpui]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Add checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS.txt
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tooling/attach-draft-release.mjs packages
