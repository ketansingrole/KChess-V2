name: Release

# Versions are YEAR.MONTH.COUNTER (v2026.10.0, v2026.10.1, … v2026.11.0); `cargo xtask
# release-version` sets the next one in Cargo.toml. Push the matching tag to build installers for
# macOS, Windows and Linux and attach them to a draft GitHub Release, which you then publish by
# hand. "Run workflow" in the Actions tab builds the same installers as downloads, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `release-verify` reads the tagged commit's CI run.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-gpui-libs
      # Its CI ran `cargo xtask check` on this very commit.
      - name: Verify release metadata and the commit's CI
        run: cargo xtask release-verify
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the release commit belongs to main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main

  # KChess for every platform. Signed and notarized on macOS with the Developer ID when its
  # secrets are set, ad hoc otherwise.
  package:
    # Only a validated commit is packaged, and only a `v*` tag reaches the `release` environment
    # that holds the Developer ID and notarization secrets: a manual run builds ad hoc.
    needs: validate
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      KCHESS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
      # As CI's release commit, so its dependencies' cache applies here.
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-gpui-libs
      - name: Install NSIS
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-nsis
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: package
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      # The packager signs with codesign directly, so the certificate goes into a keychain of this
      # job's own, and the identity is named by its hash.
      - name: Import the Developer ID certificate
        id: mac-signing
        if: runner.os == 'macOS' && env.KCHESS_MAC_SIGNING == 'true'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/kchess-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/kchess-signing.p12"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/ { print $2; exit }')"
          test -n "$identity" || { echo "::error::No Developer ID Application identity in MAC_CSC_LINK."; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - run: cargo xtask package
        env:
          # Stockfish's release check; shared runners hit GitHub's anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          KCHESS_SIGN_IDENTITY: ${{ steps.mac-signing.outputs.identity }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify Mac signing and notarization
        if: runner.os == 'macOS' && env.KCHESS_MAC_SIGNING == 'true'
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The app as the updater and a download receive it: from the zip that ships.
          unpacked="$RUNNER_TEMP/kchess-zip"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          ditto -x -k apps/gpui/dist/KChess-*-mac-arm64.zip "$unpacked"
          mac_app="$unpacked/KChess.app"
          codesign --verify --deep --strict --verbose=2 "$mac_app"
          signing_team="$(codesign --display --verbose=4 "$mac_app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$signing_team" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::$mac_app's signing team does not match APPLE_TEAM_ID."
            exit 1
          fi
          spctl --assess --type execute --verbose=2 "$mac_app"
          xcrun stapler validate "$mac_app"
      # Small updates: each package's patch from the newest published releases' files
      # (`cargo xtask deltas`, crates/kchess-delta). An installation with no patch for its version
      # downloads the whole package, so a failure here costs size, never an update: it warns.
      - name: Write the update patches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cargo xtask deltas apps/gpui/dist || { echo "::warning::No update patches for $RUNNER_OS: installations download the whole package."; exit 1; }
      # `cargo xtask package` fails without every package this platform releases. The release job
      # writes one SHA256SUMS.txt for every package.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kchess-${{ runner.os }}
          path: |
            apps/gpui/dist/*
            !apps/gpui/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      # The Snap Store's KChess, from this job's build (`kchess-snap`, which the release job
      # attaches); the store publishes it from the published release (snap-publish.yml).
      - if: runner.os == 'Linux'
        uses: ./.github/actions/snap

  # The release profile's dependencies, which the release commit's CI saved for this build, are
  # nobody's until the next release commit, whose new version gives them a new key: dropped, they
  # leave their 2.75 GB (2026-11-09) under the repository's 10 GB to the caches pull requests read.
  # The App Store build restores them too.
  drop-caches:
    needs: [package, app-store]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      # Not `v0-rust-package-` alone, which `package-fast`'s keys start with too.
      - uses: ./.github/actions/drop-caches
        with:
          prefix: |
            v0-rust-package-Darwin-
            v0-rust-package-Linux-
            v0-rust-package-Windows_NT-

  # The Mac App Store's KChess: a tag's build goes to App Store Connect (TestFlight), and review
  # follows the published release (app-store-publish.yml). It is no release asset.
  app-store:
    needs: validate
    uses: ./.github/workflows/app-store-build.yml
    # Only what the App Store build uses, never the Developer ID, Snapcraft or release key.
    secrets:
      MAS_APP_P12: ${{ secrets.MAS_APP_P12 }}
      MAS_INSTALLER_P12: ${{ secrets.MAS_INSTALLER_P12 }}
      MAS_P12_PASSWORD: ${{ secrets.MAS_P12_PASSWORD }}
      MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

  release:
    needs: [validate, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The release key's secret lives in this environment, limited to `v*` tags (Settings →
    # Environments → release → deployment branches and tags).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # Only the GitHub downloads: the App Store package goes to App Store Connect alone.
          pattern: kchess-*
          path: packages
          merge-multiple: true
      # Electron's updater reads `latest*.yml` from the newest release: they send every Electron
      # installation to the frozen stepping-stone release's own installers, checked against the
      # pins and its signed checksums first (`tooling/xtask/src/electron_step.rs`). Never skip it.
      - name: Point Electron installs at the stepping-stone release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cargo xtask electron-step packages
      - name: Add checksums
        run: cargo xtask sums packages
      # Installed apps refuse checksums the release key has not signed (apps/gpui/update-key.pub).
      - name: Sign the checksums
        env:
          KCHESS_UPDATE_SIGNING_KEY: ${{ secrets.KCHESS_UPDATE_SIGNING_KEY }}
        run: cargo xtask sign-sums packages/SHA256SUMS.txt
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cargo xtask attach-draft-release packages
