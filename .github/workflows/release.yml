name: Release

# Versions are YEAR.MONTH.COUNTER (v2026.10.0, v2026.10.1, … v2026.11.0); `npm run release:version`
# sets the next one in package.json. Push the matching tag to build installers for macOS,
# Windows and Linux and attach them to a draft GitHub Release, which you then publish by hand.
# "Run workflow" in the Actions tab builds the same installers as downloads, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify release metadata
        run: npm run release:verify
      - name: Verify the release commit belongs to main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run check

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS releases support Apple Silicon only.
          - os: macos-latest
            platform: --mac --arm64
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Certificates are imported explicitly; never use an unrelated keychain identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      KCHESS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # afterPack rejects nested installers/apps, redundant dependencies, and oversized payloads.
      - name: Build installers and verify package contents
        run: npx electron-builder ${{ matrix.platform }} --config scripts/release-config.cjs --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify Mac signing and notarization
        if: runner.os == 'macOS' && env.KCHESS_MAC_SIGNING == 'true'
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mac_app=dist/mac-arm64/KChess.app
          codesign --verify --deep --strict --verbose=2 "$mac_app"
          signing_team="$(codesign --display --verbose=4 "$mac_app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$signing_team" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::The app's signing team does not match APPLE_TEAM_ID."
            exit 1
          fi
          spctl --assess --type execute --verbose=2 "$mac_app"
          xcrun stapler validate "$mac_app"
      - name: Verify update metadata exists
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) manifest=dist/latest-mac.yml ;;
            Windows) manifest=dist/latest.yml ;;
            Linux) manifest=dist/latest-linux.yml ;;
          esac
          test -s "$manifest" || { echo "::error::Missing update metadata: $manifest"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: kchess-${{ runner.os }}
          path: |
            dist/*-mac-arm64.dmg
            dist/*-mac-arm64.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*-mac-arm64.*.blockmap
            dist/*.exe.blockmap
            dist/*.AppImage.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Add checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS.txt
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/attach-draft-release.mjs packages
