name: Windows upgrade

# Installs a published Windows release three ways (per user, in a custom folder, for all users),
# upgrades it with this commit's installer the way an installed KChess runs it (`--updated /S`,
# which every Electron release's updater does too) and checks Apps & features, shortcuts, the old
# copy and user data. A fresh install checks the default folder. CI runs it whenever packaging may
# have changed since the last release (ci.yml); run it from the Actions tab any time.
on:
  workflow_call:
    inputs:
      # Without the release profile's fat LTO (ci.yml).
      fast:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  # Above every release, so the new installer is always an upgrade.
  KCHESS_TEST_VERSION: 9999.0.${{ github.run_number }}

jobs:
  # CI's Windows package, made here rather than twice.
  build:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.fast && 'off' || 'fat' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.fast && '16' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install NSIS
        uses: ./.github/actions/install-nsis
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ inputs.fast && 'package-fast' || 'package' }}
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The app and its installer take the test version from KCHESS_PACKAGE_VERSION.
      - run: cargo xtask package
        env:
          KCHESS_PACKAGE_VERSION: ${{ env.KCHESS_TEST_VERSION }}
          # Stockfish's release check; shared runners hit GitHub's anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: apps/gpui/dist/KChess-*-win-x64.exe
          if-no-files-found: error
          retention-days: 3

  upgrade:
    name: Upgrade (${{ matrix.mode }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, default, custom, allusers]
        include:
          # Releases from 2026.10.12 install per user even with /allusers, so the all-users copy
          # that the installer must remove comes from the last assisted installer.
          - mode: allusers
            release: v2026.10.11
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tooling/windows-upgrade-test.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: new
      - name: Download the published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ matrix.release }}
        run: |
          # Without a tag, gh downloads the latest published release.
          $tag = @($env:RELEASE | Where-Object { $_ })
          # KChess's own installer, not the preview's (`KChess-Preview-…`) earlier releases carried.
          gh release download @tag --repo $env:GITHUB_REPOSITORY --pattern 'KChess-2*-win-x64.exe' --pattern SHA256SUMS.txt --dir old
          $installer = Get-Item old/*-win-x64.exe
          # The installer's own line: its name also starts the `.exe.blockmap` line.
          $line = Get-Content old/SHA256SUMS.txt | Where-Object { ($_ -split '\s+', 2)[1] -eq $installer.Name }
          if (@($line).Count -ne 1) { throw "SHA256SUMS.txt has no single entry for $($installer.Name)." }
          $expected = ($line -split '\s+', 2)[0]
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Checksum mismatch for $($installer.Name)." }
          Write-Host "Published installer: $($installer.Name)"
      - name: Upgrade and check
        shell: pwsh
        run: >
          ./tooling/windows-upgrade-test.ps1 -Mode ${{ matrix.mode }}
          -OldInstaller (Get-Item old/*-win-x64.exe).FullName
          -NewInstaller (Get-Item new/*.exe).FullName
          -NewVersion $env:KCHESS_TEST_VERSION
