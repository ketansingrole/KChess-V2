name: Fuzz
# Coverage-guided fuzzing of the rules' parsers of outside input (fuzz/). Weekly, and on demand;
# a crash uploads the input that caused it (reproduce with `cargo fuzz run <target> <file>` in fuzz/).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        type: number
        default: 300

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pgn, fen, uci_info, online_event, api_call]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rustup installs fuzz/rust-toolchain.toml's nightly on first use.
      - uses: taiki-e/install-action@cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz-${{ matrix.target }}
      - name: Fuzz ${{ matrix.target }}
        # Inputs reach the script as variables, never as expanded text.
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
        run: |
          mkdir -p "corpus/$TARGET"
          cp "seeds/$TARGET"/* "corpus/$TARGET/"
          max_len=8192
          if [ "$TARGET" = api_call ]; then max_len=65536; fi
          cargo fuzz run -O "$TARGET" "corpus/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -max_len=$max_len -rss_limit_mb=4096
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
