name: Fuzz
# Coverage-guided fuzzing of the rules' parsers of outside input (fuzz/). Weekly, and on demand;
# a crash uploads the input that caused it (reproduce with `cargo fuzz run <target> <file>` in fuzz/).
on:
  schedule:
    - cron: '17 3 * * 1'
  # A change to how the run builds or installs cargo-fuzz builds every target, instrumented, before
  # it lands: the weekly run failed every week from 2026-11-09 to 11-16 without anyone seeing it.
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - .github/actions/install-tools/**
      - fuzz/Cargo.toml
      - fuzz/Cargo.lock
      - fuzz/rust-toolchain.toml
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '300'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pgn, fen, uci_info, online_event, chesscom, tree]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # rustup installs fuzz/rust-toolchain.toml's nightly on first use.
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          shared-key: fuzz-${{ matrix.target }}
      # cargo-fuzz builds for the target it was itself built for unless told: install-action's
      # cargo-fuzz is a static musl binary, so every target was built for musl, which the address
      # sanitizer refuses and the nightly has no standard library for. The runner's own target.
      - name: Fuzz ${{ matrix.target }}
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && '10' || inputs.seconds || '300' }}
        run: |
          case "$SECONDS_TO_RUN" in ''|*[!0-9]*) echo "::error::seconds must be a number"; exit 1;; esac
          host="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p corpus/${{ matrix.target }}
          cp seeds/${{ matrix.target }}/* corpus/${{ matrix.target }}/
          cargo fuzz run -O --target "$host" ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time="$SECONDS_TO_RUN" -max_len=8192 -rss_limit_mb=4096
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/

  # A scheduled run's failure opens an issue, and its next pass closes it (.github/actions/scheduled-report).
  report:
    needs: [fuzz]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/scheduled-report
        with:
          name: Fuzz
          failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
