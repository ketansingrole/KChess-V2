name: Mutants
# Mutation testing (docs/mutation-testing.md): cargo-mutants changes the code one small edit at a
# time and fails when the tests still pass. A whole package takes hours, so it runs in shards:
# every week the rules (kchess-domain), and any package when started by hand. A missed mutant is a
# test to write, or an equivalent mutant to exclude in .cargo/mutants.toml with the reason; never a
# test to weaken.
on:
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:
    inputs:
      package:
        description: Package to mutate
        default: kchess-domain
        type: choice
        # Every workspace member but the workspace hack (xtask's `workflows` tests hold it to that).
        options: [kchess-domain, kchess-core, kchess-gpui, kchess-service, kchess-cli, kchess-games, kchess-contracts, kchess-delta, kchess-host, kchess-testkit, kchess-voice, xtask]

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci

jobs:
  mutants:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: inputs.package == 'kchess-gpui'
        uses: ./.github/actions/install-gpui-libs
      # CI's caches, read only: this workflow saves none of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest,cargo-mutants
      # The engines CI's `check` gives the tests, as a pull request's mutants job does: without
      # them the tests that need an engine skip, and their mutants are reported missed.
      - uses: ./.github/actions/engines
      - name: Mutants
        env:
          PACKAGE: ${{ inputs.package || 'kchess-domain' }}
          SHARD: ${{ matrix.shard }}
        # As a pull request's mutants run (ci.yml): in the checkout, built incrementally, each
        # mutant's tests ending at their first failure (tooling/xtask/src/mutants.rs).
        run: cargo xtask mutants --all --in-place -- -p "$PACKAGE" --shard "$SHARD/8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutants-${{ inputs.package || 'kchess-domain' }}-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # The app's mutants each rebuild the app, so pull requests leave them out (ci.yml): every week
  # this tests the mutants of the lines the past week changed in the app, as a pull request would.
  gpui:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-gpui-libs
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest,cargo-mutants
      # The engines CI's `check` gives the tests, as a pull request's mutants job does.
      - uses: ./.github/actions/engines
      - name: Mutants of the app's lines changed this week
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          cargo xtask mutants --app --in-place --base "$(git rev-list -1 --before='7 days ago' HEAD)"
          -- --shard "$SHARD/4"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutants-gpui-week-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14
