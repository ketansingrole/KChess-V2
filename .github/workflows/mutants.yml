name: Mutants
# Mutation testing (docs/mutation-testing.md): cargo-mutants changes the code one small edit at a
# time and fails when the tests still pass. The rules and the core take hours, so each runs in
# shards, weekly and on demand. A missed mutant is a test to write, or an equivalent mutant to
# exclude in .cargo/mutants.toml with the reason; never a test to weaken.
on:
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:
    inputs:
      package:
        description: Package to mutate
        default: kchess-domain
        type: choice
        options: [kchess-domain, kchess-core, kchess-gpui, kchess-service, kchess-cli, kchess-games, kchess-contracts, kchess-voice, xtask]

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci
  GPUI_LINUX_LIBS: >-
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev

jobs:
  mutants:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install GPUI build libraries
        if: inputs.package == 'kchess-gpui'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      # CI's caches, read only: this workflow saves none of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest,cargo-mutants
      - name: Mutants
        env:
          PACKAGE: ${{ inputs.package || 'kchess-domain' }}
          SHARD: ${{ matrix.shard }}
        run: cargo mutants -p "$PACKAGE" --test-tool nextest --shard "$SHARD/8" --no-shuffle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutants-${{ inputs.package || 'kchess-domain' }}-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # The app's mutants each rebuild the app, so pull requests leave them out (ci.yml): every week
  # this tests the mutants of the lines the past week changed in the app, as a pull request would.
  gpui:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install GPUI build libraries
        run: sudo apt-get update && sudo apt-get install -y ${{ env.GPUI_LINUX_LIBS }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest,cargo-mutants
      # The engines CI's `check` gives the tests, as a pull request's mutants job does.
      - name: Fetch the engines
        run: cargo xtask engines --github-env "$RUNNER_TEMP/stockfish"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mutants of the app's lines changed this week
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          cargo xtask mutants --base "$(git rev-list -1 --before='7 days ago' HEAD)"
          -- --file 'apps/gpui/**' --shard "$SHARD/4"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutants-gpui-week-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14
