name: Stress
# The app's and the core's tests oversubscribed, several times over, on every platform: timing races
# show up here as failures with a test name, nightly, instead of as a red run on main. Four of the
# six CI failures on main from 2026-10-29 to 2026-11-06 were such races, three of them on Windows.
# A failure here is a bug to fix with a regression (GUARDRAILS.md), never a test to retry.
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Runs of each test
        default: '3'

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-gpui-libs
      # CI's caches, read only: this workflow saves none of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ runner.os == 'Linux' && 'check' || 'gpui' }}
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest
      # Four times as many tests at once as the runner has cores, as GUARDRAILS.md's
      # `--test-threads=40` does on a 10-core Mac.
      - name: Oversubscribed tests
        shell: bash
        env:
          STRESS_COUNT: ${{ inputs.count || '3' }}
        run: |
          case "$STRESS_COUNT" in ''|*[!0-9]*) echo "::error::count must be a number"; exit 1;; esac
          threads=$(( $(nproc 2>/dev/null || sysctl -n hw.ncpu) * 4 ))
          cargo nextest run -p kchess-gpui -p kchess-core -p kchess-service --locked \
            --test-threads "$threads" --stress-count "$STRESS_COUNT"
