# cargo-nextest, the test runner of `cargo xtask check`, `check-fast` and CI: every test in its own
# process, all of them in parallel across the workspace's test binaries (`cargo test` runs one
# binary at a time). The workspace has no doctests (xtask's `boundaries` test refuses one). The
# app (`kchess-gpui`) is the exception: one binary whose tests each start GPUI, faster under
# `cargo test` (2026-11-06: 60 s against 74 s).

[profile.default]
# Most tests wait (on processes, sockets, timeouts) rather than compute: the headless suite used
# 28 s of CPU in a 20 s run on 10 cores (2026-11-10). One test per core left CI's 4-core runners
# mostly idle; 16 at once ran it in 14 s here, and passed three times over at 40.
test-threads = 16
# A test past a minute is reported as slow, and one past five minutes is killed, so a hang names
# its test instead of stalling the run.
slow-timeout = { period = "60s", terminate-after = 5 }
# Name only the tests that are slow or fail, and the summary: a thousand PASS lines bury them.
status-level = "slow"
final-status-level = "slow"

# CI (`NEXTEST_PROFILE=ci`): every failure of the run, not only the first.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# The memory benchmarks (kchess-core's `tests/memory.rs`) print what each scenario kept, passing or
# not, so CI's logs show a drift toward the allowance before it fails: a passing run's output was
# hidden, and on 2026-11-10 a Windows failure had no record of how close main's runs came. The
# default profile's overrides apply to every profile.
[[profile.default.overrides]]
filter = 'package(kchess-core) & binary(memory)'
success-output = "final"

# The tests that wait by design start first, as Zed orders its slowest, so the run's end is not
# held for one that started late: the review queue's first pass waits its 10 s startup delay, the
# service tests start and stop real service processes (5 to 11 s), the memory benchmarks run their
# scenarios (4 to 5 s). Measured on 2026-11-20, every other test took under 4 s; one that took
# longer was a test waiting out a deadline it should not have met (ongoingGames' challenge listing,
# 30 s), so a slow test is a cause to find before it is one to list here.
[[profile.default.overrides]]
filter = 'package(kchess-core) & test(engine_review::a_review_asked_for_while_the_queue_finds_nothing_still_runs)'
priority = 100

[[profile.default.overrides]]
filter = 'package(kchess-service) & (test(the_first_app_starts_the_service_and_the_second_reuses_it) | test(one_core_per_profile_and_it_stops_when_idle) | test(a_core_that_never_answers_hello_fails_the_connection))'
priority = 90

[[profile.default.overrides]]
filter = 'package(kchess-core) & binary(memory)'
priority = 80
