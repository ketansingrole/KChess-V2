# cargo-nextest, the test runner of `cargo xtask check`, `check-fast` and CI: every test in its own
# process, all of them in parallel across the workspace's test binaries (`cargo test` runs one
# binary at a time). Doctests are not nextest's: `cargo xtask check` runs `cargo test --doc`. The
# app (`kchess-gpui`) is the exception: one binary whose tests each start GPUI, faster under
# `cargo test` (2026-11-06: 60 s against 74 s).

[profile.default]
# A test past a minute is reported as slow, and one past five minutes is killed, so a hang names
# its test instead of stalling the run.
slow-timeout = { period = "60s", terminate-after = 5 }
# Name only the tests that are slow or fail, and the summary: a thousand PASS lines bury them.
status-level = "slow"
final-status-level = "slow"

# CI (`NEXTEST_PROFILE=ci`): every failure of the run, not only the first.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# Mutation testing (`cargo xtask mutants` picks it): a mutant is caught by its first failing test,
# so the run ends there, the tests still running included. Waiting for the rest let a mutant that
# leaves calls unanswered (a dozen tests waiting on them) run past cargo-mutants' timeout, and it
# read as a timeout rather than caught.
[profile.mutants]
fail-fast = { max-fail = 1, terminate = "immediate" }
