# `cargo xtask <command>`: the repository's own tooling (tooling/xtask).
[alias]
xtask = "run -q -p xtask --"

# macOS: the linker drops local symbols itself (-x). `strip` from recent Xcode releases leaves
# large dylibs with a mis-aligned LINKEDIT string pool that dyld refuses to load.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-x"]
# `cargo run` signs the GPUI app with a stable identity, so the keychain remembers it.
runner = "tooling/macos-dev-runner.sh"

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-x"]

# Linux: no flags. Every build keeps its symbol table, so a backtrace (a failed test's, a panic in a
# player's log) names its functions; `--strip-all` once dropped it to keep the Electron app's Node
# module small, and left every frame `<unknown>`. Packages drop only the debug info
# (`cargo xtask package`, tooling/xtask/src/package/mod.rs).
