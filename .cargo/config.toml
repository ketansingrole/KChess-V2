# The renderer's rules module: analysis trees up to 1024 moves deep are read and written
# recursively, which needs more than WebAssembly's default 1 MiB stack.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=8388608"]

# macOS: the linker drops local symbols itself (-x). `strip` from recent Xcode releases leaves
# large dylibs with a mis-aligned LINKEDIT string pool that dyld refuses to load.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-x"]
# `cargo run` signs the GPUI app with a stable identity, so the keychain remembers it.
runner = "tooling/macos-dev-runner.sh"

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-x"]

# Linux: keep exported dynamic symbols for N-API, but remove the local symbol table
# from the shipped core module so it stays within the package's file-size budget.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--strip-all"]

# Not shipped, but `pnpm run linux` on Apple Silicon packages it with the same budget.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--strip-all"]
