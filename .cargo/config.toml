# `cargo xtask <command>`: the repository's own tooling (tooling/xtask).
[alias]
xtask = "run -q -p xtask --"

# macOS: the linker drops local symbols itself (-x). `strip` from recent Xcode releases leaves
# large dylibs with a mis-aligned LINKEDIT string pool that dyld refuses to load.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-x"]
# `cargo run` signs the GPUI app with a stable identity, so the keychain remembers it.
runner = "tooling/macos-dev-runner.sh"

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-x"]

# Linux: remove the local symbol table from the shipped binaries.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--strip-all"]

# Not shipped, but `cargo xtask linux` on Apple Silicon builds with the same flags.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--strip-all"]
