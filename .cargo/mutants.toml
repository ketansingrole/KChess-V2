# cargo-mutants (`cargo install cargo-mutants`): `cargo mutants -p <package>` changes the code one
# small edit at a time and reports each edit no test notices. See docs/mutation-testing.md.

# Mutants no test can tell apart from the original, because the program behaves the same. Each
# entry names why; never add one only because a test is missing.
exclude_re = [
    # A load command shorter than 8 bytes and a whole number of 8-byte words can only be 0 long,
    # and a 0-long one is read again until the command count runs out, finding no symbol table:
    # `None` either way.
    'tooling/xtask/src/sweep\.rs:.*: replace \|\| with && in debug_map',
    # The version bits are cleared by the mask first, so `| 0x40` and `^ 0x40` (and `| 0x80` and
    # `^ 0x80`) set the same byte.
    'kchess-games/src/archive\.rs:.*: replace \| with \^ in new_id',
    # A deadline compared with `<=` instead of `<` differs only at the very instant it passes, and
    # the next attempt's own deadline ends the loop at that instant either way.
    'kchess-service/src/client\.rs:.*: replace < with <= in (connect_or_start|wait_until_gone)',
    # The board tests' wait gives up at its limit; `<=` differs only at the very instant it passes.
    'kchess-board/src/testing\.rs:.*: replace < with <= in Started::wait_within$',
    # A game stream closed within 10 s of opening counts as taken by another device; `<=` differs
    # only for a stream that lived exactly 10 s to the nanosecond, which no read can arrange.
    'kchess-core/src/lichess/online/session\.rs:.*: replace < with <= in OnlineSession::listen_loop$',
    # `plain` names no message: `None`, which is also what `Default::default()` is for a `Msg`.
    'kchess-contracts/src/check\.rs:.*: replace plain -> Msg with Default::default\(\)$',
    # The command line closes its core only as the process exits, with the core's writes already
    # on disk: what a test can see afterwards is the same whether or not it was closed.
    'apps/cli/src/core\.rs:.*: replace CoreClient::close with \(\)$',
    # The Lichess client only builds its request with this client; `Policy::send` executes it with
    # the policy's own, which adds the headers and deadlines. Any client builds the same request.
    'kchess-core/src/lichess/policy\.rs:.*: replace Policy::http -> &reqwest::Client with ',
    # Setting the folder's mode to 0700 when it already is 0700 changes nothing.
    'kchess-service/src/discovery\.rs:.*: replace & with [|^] in private_dir',
    # DETACHED_PROCESS and CREATE_NEW_PROCESS_GROUP share no bit, so `|` and `^` are the same.
    'kchess-service/src/client\.rs:.*: replace \| with \^ in launch',
    # A uniform draw picks White half the time whether below or above 0.5 counts, and exactly
    # 0.5 has no weight.
    'kchess-games/src/lib\.rs:.*: replace < with (>|<=) in draw_color',
    # A review with a score for every position is told its positions' ends too when `<` becomes
    # `<=`: only `eval_at` reads them, and it reads a position's score first, so the analysis is
    # the same; the ends only cost the time to work them out.
    'kchess-domain/src/review\.rs:.*: replace < with <= in analyse_moves$',
    # A move is Good below a loss of 5 and `<=` differs only at exactly 5, which no score
    # reaches: the loss is 50 times a difference of winning chances, each `2 / (1 + exp) - 1` and
    # so a multiple of 2^-53, and none of those lies within half an ulp of 5 / 50. (Searched over
    # 60,000 starting scores too: the nearest is 5.000000000000004.)
    'kchess-domain/src/review\.rs:.*: replace < with <= in classifications$',
    # Every numeric setting (the sound volume and the correspondence poll) has its own arm before
    # it, so no stored setting reaches the general numeric arm: without it, `_ => None` answers
    # what it would have.
    'kchess-core/src/store/games\.rs:.*: delete match arm \(_, Value::Number\(_\)\) in stored_setting$',
    # A storage call is logged as slow past the lane's limit; `>=` differs only for a call that
    # lasts the limit to the nanosecond. Logging past the limit and not before is tested
    # (`a_slow_call_is_logged_with_its_caller`).
    'kchess-core/src/store/sql\.rs:.*: replace > with >= in Lane::run_admitted$',
    # A patch exactly as long as the file whole: either makes the same file, and no input makes
    # bsdiff's compressed patch and bzip2's whole file the same length to test it.
    'kchess-delta/src/lib\.rs:.*: replace < with <= in build',
    # Only macOS keeps crash reports where KChess looks, and only a Mac build runs in the App
    # Sandbox: where CI runs mutants (Linux) both answer nothing either way. Their tests tell the
    # mutants apart on macOS, where the pre-push hook runs them
    # (`crash_reports_are_looked_for_where_macos_keeps_them`,
    # `only_a_sandboxed_mac_build_is_the_app_stores`).
    'kchess-app/src/crashes\.rs:.*: replace crash_reports -> Option<PathBuf> with None$',
    'kchess-host/src/lib\.rs:.*: replace app_store -> bool with false$',
    # Mutants run on x86-64, where the arm64 arm is never taken; the app's updater tests use it on
    # the Apple Silicon runner (CI's `gpui` job on macOS), where every asset name needs it.
    'kchess-delta/src/assets\.rs:.*: delete match arm "aarch64" in Arch::current$',
    # Every signer reads as unsigned where mutants run (Linux): `codesign` is macOS's and
    # Authenticode PowerShell's, so a staged update and the running app always match there. What
    # it calls is tested (`an_update_is_signed_as_the_app_it_replaces`, and on macOS
    # `codesign_reads_who_signed_a_bundle`).
    'apps/gpui/src/updates\.rs:.*: (replace signed_as_running -> Result<\(\), String> with Ok\(\(\)\)|delete ! in signed_as_running)$',
    # Makes the installers with makensis, which only the Windows package jobs have (the Windows
    # upgrade workflow installs and checks what it makes); the scripts it runs are tested.
    'xtask/src/package/windows\.rs:.*: (replace package -> Result<Vec<PathBuf>> with .*|replace / with [%*] in package)$',
    # Forgets a Windows installation in the registry; elsewhere it does nothing (and without its
    # `cfg!(windows)` guard, finds no `reg` and nothing recorded), so a run on Linux or macOS
    # cannot tell it from nothing. What it decides is `forgotten`, tested. The Windows upgrade
    # workflow's patch step needs it.
    'tooling/xtask/src/deltas\.rs:.*: (replace forget_installation with \(\)|replace forget_installation -> Result with .*|delete ! in forget_installation)$',
    # `appimage` only binds the real pins, cache and download to `appimage_with`, which its test
    # runs whole with a stand-in appimagetool; the binding itself downloads from GitHub and runs
    # the real tool, so it is seen only by `cargo xtask package` on Linux (CI's package job).
    'tooling/xtask/src/package/linux\.rs:.*: replace appimage -> Result<PathBuf> with ',
    # `fairy::build` and `voice::stage` only bind the real pins, `target` folders and download to
    # `build_with` and `stage_with`, which their tests run whole with stand-in archives; the
    # bindings themselves download from GitHub (and `build` compiles Fairy-Stockfish), so they
    # are seen only by `cargo xtask fairy-stockfish`, `voice-runtime` and `package`.
    'tooling/xtask/src/fairy\.rs:.*: replace build -> Result<PathBuf> with ',
    'tooling/xtask/src/voice\.rs:.*: replace stage -> Result<PathBuf> with ',
    # Likewise bindings of the real environment, tools and repository to what their tests run
    # whole: `stage_if_outdated` to `outdated` and `stage`; `engines::run` to `run_with` with
    # `stockfish` (which runs kchess-core's fetch_stockfish, downloading from GitHub) and
    # `fairy::build`; the app's `engine` to that `stockfish`; `update_key::sign` to `sign_with`
    # with the release job's secret; `release::verify` to `metadata` with the repository's files
    # and `tag_build` (GITHUB_REF, unset or a branch where tests run). Each is seen only when its
    # command runs: `cargo xtask app`, `engines` (CI's check and mutants jobs), `sign-sums` and
    # `release-verify` (the Release workflow), `check` (CI's check job).
    'tooling/xtask/src/voice\.rs:.*: replace stage_if_outdated -> Result<\(\)> with ',
    'tooling/xtask/src/engines\.rs:.*: replace (stockfish -> Result<PathBuf>|run -> Result) with ',
    'tooling/xtask/src/app\.rs:.*: replace engine -> Result<PathBuf> with ',
    # `check_startable` binds the PID file's running app and the environment to `startable`,
    # tested; only `cargo xtask app` sees the binding.
    'tooling/xtask/src/app\.rs:.*: replace check_startable -> Result with ',
    'tooling/xtask/src/update_key\.rs:.*: replace sign -> Result with ',
    'tooling/xtask/src/release\.rs:.*: replace (verify -> Result|tag_build -> Option<String>) with ',
    # Stops the profile's running core service by its process ID; which one is outdated is
    # `outdated_service`, tested. Seen by `cargo xtask app`.
    'tooling/xtask/src/app\.rs:.*: replace stop_outdated_service -> Result with ',
    # Run cargo fmt, clippy and the test suites over the whole workspace, so a test of them
    # would run `check` inside `check`; what they decide is tested (`test_commands`,
    # `coverage_args`, `with_dependents`, `scope_of`, `select`, `merge_base`). CI's check job
    # runs them and its log shows each step. `fast` only runs what `select` chose; `ui_tests`
    # runs `ui`'s packages' tests (CI's gpui job on Linux, `uncovered` tested). Likewise
    # `fuzz_targets`, which runs `cargo check` over the fuzz workspace, and `scope`, which prints
    # `scope_report`'s answer for the repository (tested on a scratch one) for CI's changes job.
    'tooling/xtask/src/check\.rs:.*: replace (format|clippy_workspace|lints|tests|ui_tests|fast|full|full_with|check|fuzz_targets|scope) -> Result with ',
    # Commands over the repository's own files and `cargo metadata`, which pass there, so a test
    # sees the same `Ok` from them as from their mutants; what they decide is tested: the hack's
    # `dependencies`, `outside` and `packages`, the notices' `direct_dependencies` and `names`,
    # the license file's `shipped_crates` and `license_text`. `check` runs the first two.
    'tooling/xtask/src/hack\.rs:.*: replace check -> Result with ',
    # `hack` writes the hack, the locks and dependabot.yml with cargo-hakari and Cargo, then runs
    # `check`, so on the repository a mutant changes nothing a test sees; what it writes is `hold`
    # and `hack_only`, tested. The Dependabot hack workflow runs it, and CI's check refuses what it
    # leaves out of date. `read` and `metadata` feed only these two.
    'tooling/xtask/src/hack\.rs:.*: replace (write -> Result|read -> Result<String>|metadata -> Result<serde_json::Value>) with ',
    'tooling/xtask/src/hack\.rs:.*: .* in write$',
    'tooling/xtask/src/licenses\.rs:.*: replace (check_notices|write) -> Result with ',
    'tooling/xtask/src/check\.rs:.*: .* in fast$',
    # `check`'s tests without cargo-llvm-cov: whether it leaves out the app's tests is
    # `with_app_tests` and `uncovered`, tested; CI's check job runs the rest.
    'tooling/xtask/src/check\.rs:.*: replace != with == in tests$',
    # The Git pre-push hook: reads the push from standard input and runs `check` or cargo-mutants
    # on the working tree, so a test of it would run them inside the tests; what it decides is
    # tested (`main_pushes`, `push_problem`, `head_push`, `mutants_base`, `jobs_for`,
    # `branch_mutants_args`).
    # Every push from a clone with `cargo xtask install-hooks` runs it.
    'tooling/xtask/src/check\.rs:.*: (replace (pre_push|branch_mutants) -> Result with |.* in (pre_push|branch_mutants)$)',
    # `mutants`' entry and its plan: they run cargo-mutants on the repository itself, so a test of
    # them would run it inside the tests; what the plan decides is tested (`shards_for`,
    # `plan_outputs`, `count_since`, `count_listed`), and CI's mutants-plan job runs it on every
    # pull request. `warm` builds every member's tests, as `warm_commands` (tested) says, for CI's
    # mutants cache.
    'tooling/xtask/src/mutants\.rs:.*: (replace (plan|run|warm) -> Result with |.* in (plan|run)$)',
    # The weekly run of the app's mutants: the plan builds the app's tests with coverage and runs
    # each, and a shard runs cargo-mutants on the repository, so a test of them would run the
    # app's suite and cargo-mutants inside the tests; `cpus` only weighs the estimates by the
    # machine's processors. What they decide is tested (`mutants_listed`, `covered_lines`,
    # `Index`, `wall`, `chunks`, `shard_count`, `assign`, `plan_json`, `planned_for`,
    # `chunk_args`, `merge`, `verdict`, `in_parallel`); the Mutants workflow's `gpui-plan` and
    # `gpui` jobs run them every Sunday.
    'tooling/xtask/src/app_mutants\.rs:.*: (replace (plan|list|cpus|coverage|instrumented|test_names|run_test|llvm_tools|lines_of|shard) -> .* with |.* in (plan|list|coverage|instrumented|test_names|run_test|llvm_tools|lines_of|shard)$)',
    # `bench` runs real builds of the app for minutes each, so only a benchmark run sees `run`.
    # What it decides is tested (`options`, `summary`, `regressions`, `gate`).
    'tooling/xtask/src/bench\.rs:.*: replace run -> Result with ',
    # Talk to GitHub through gh: the Electron step's download and manifests, the release check of
    # a commit's CI, the draft upload and the Snap download. What they decide is tested
    # (`check_step`, `check_sums`, `matches`, `manifest_text`, `ci_verdict`, `needs_ci`,
    # `pushed_tag`, `verify_snap`); the Release and Snap publish workflows run them.
    'tooling/xtask/src/electron_step\.rs:.*: replace (download -> Result<Vec<u8>>|write -> Result) with ',
    'tooling/xtask/src/release\.rs:.*: replace (verify_release|attach_draft|download_snap) -> Result with ',
    'tooling/xtask/src/release\.rs:.*: delete ! in verify_release$',
    # `release-version`: fetches origin's tags and rewrites the repository's Cargo.toml, notes and
    # Cargo.lock, so only a real release run sees it; what it writes is decided by `next_version`,
    # `date_notes` and `with_version`, tested.
    'tooling/xtask/src/release\.rs:.*: replace next -> Result with ',
    # Package with platform tools absent where mutants run: snapcraft (the Snap build workflow),
    # codesign, ditto, hdiutil, notarytool and productbuild (macOS), and the whole `package`
    # command over a release build. The scripts, plists, bundle layout and checks they use are
    # tested; CI's package, Snap and Windows upgrade jobs run them.
    'tooling/xtask/src/package/linux\.rs:.*: replace snap -> Result<PathBuf> with ',
    'tooling/xtask/src/package/mac\.rs:.*: replace sign -> Result with ',
    'tooling/xtask/src/package/(mac|mas)\.rs:.*: replace package -> Result<Vec<PathBuf>> with ',
    'tooling/xtask/src/package/mod\.rs:.*: replace run -> Result with ',
    # The power state read from the OS: no test can unplug the computer. What Linux's supplies
    # decide is tested (`supplies_on_battery`); the battery's use of a reading is tested with a
    # stand-in reader (`engine::bridge`).
    'kchess-core/src/power\.rs:.*(replace (os::)?on_battery -> bool with |in (os::)?on_battery$)',
    # ── kchess-domain: mutants whose program behaves the same ──
    # `|` and `^` (or `+` and `-`, or `&` and `|`) agree on bitboards or numbers that share no bit:
    # a king's square and its rooks', the first and eighth ranks, queens and rooks, pawn pushes and
    # captures, and a pawn's squares beside the attack set.
    'kchess-domain/src/rules\.rs:.*: replace \| with \^ in (parse_castling|backranks|parse_san)$',
    'kchess-domain/src/position\.rs:.*: replace \| with \^ in fen_problem$',
    'kchess-domain/src/training/lessons\.rs:.*: replace \| with \^ in (bare_king_against_major|play_status)$',
    # A multi-byte character's lead byte is past `h` and `8` either way, so it is no square.
    'kchess-domain/src/rules\.rs:.*: replace \|\| with && in parse_square$',
    # A rook never stands on its own king's square, so `<` and `<=` order the castling letters alike.
    'kchess-domain/src/rules\.rs:.*: replace < with <= in write_fen$',
    # Castling's `to` is the rook's square, never the king's: `>` and `>=` pick the same side.
    'kchess-domain/src/rules\.rs:.*: replace > with >= in san_without_suffix$',
    # The pieces of the role are filtered by which of them reach the square right after, so any
    # wider set of candidates gives the same set.
    'kchess-domain/src/rules\.rs:.*: replace & with \| in san_without_suffix$',
    # Each step past the move itself: the move ends on the square the fork or pin is seen from,
    # and a target is never that square; the step that made the position cannot capture a piece
    # of the side now to move.
    'kchess-domain/src/tactics\.rs:.*: replace \+ with \* in (fork|pin)$',
    # The score is filtered to non-zero the line before.
    'kchess-domain/src/tactics\.rs:.*: replace > with >= in mate_for$',
    # The king stands on the extra square, which holds no rook.
    'kchess-domain/src/editor\.rs:.*: replace \+ with \* in castling_available$',
    # The index comes from the node's own children, so it is always below their count.
    'kchess-domain/src/tree\.rs:.*: replace < with <= in TreeNode::promote$',
    # V8's `Math.exp`: NaN plus, minus or times itself is the same quiet NaN; `HUGE ± x` is about
    # 1e300 for every tiny `x`, never 1.
    'kchess-domain/src/review\.rs:.*: replace \+ with [-*] in js_exp$',
    'kchess-domain/src/review\.rs:.*: replace > with >= in js_exp$',
    # The `None` arm of `white_at` is never reached: every index is within the positions.
    'kchess-domain/src/review\.rs:.*: replace == with != in analyse_moves$',
    # The scientific layout is used only for exponents of 21 and up or -7 and down, and 0 and
    # negative zero return before the sign is picked.
    'kchess-domain/src/js\.rs:.*: replace < with <= in number_to_string$',
    # The PGN reader stops when a token or header would not move it forward; every real one does,
    # so the guard's `>` and `>=` (or `<` and `<=`) differ only for a match that never happens.
    'kchess-domain/src/pgn\.rs:.*: replace > with >= in tokens$',
    'kchess-domain/src/pgn\.rs:.*: replace < with <= in Parser::handle_line$',
    # A line is too long only if its UTF-16 length is, which never exceeds its byte length: the
    # byte check only skips decoding short lines. A row solid for the sampler is solid for themes
    # too, so the early return only saves the work below, which the same two flags guard.
    'kchess-domain/src/puzzle\.rs:.*: replace > with >= in Sampler::(add_bytes|push)$',
    'kchess-domain/src/puzzle\.rs:.*: delete ! in Sampler::add_bytes$',
    # File and rank are whole numbers (or NaN), so their sum and difference share their parity.
    'kchess-domain/src/training/board_vision\.rs:.*: replace \+ with - in square_color$',
    # Equal material adds no extra pieces either way.
    'kchess-domain/src/material\.rs:.*: replace > with >= in diff$',
    # A wait of zero gives zero either way.
    'kchess-domain/src/online_game/events\.rs:.*: replace > with >= in Run<.*>::read_state$',
    # The calendar takes only years -9999 to 9999, far inside the limit, so the guard only saves
    # work; `is_finite` is the one that refuses.
    'kchess-domain/src/records/ratings\.rs:.*: replace > with (==|>=) in utc_date$',
    # Clamped to ±1000, the two forms differ only past 99,000 moves to mate; `Mate(0)` is taken by
    # the arm above.
    'kchess-domain/src/training/guess\.rs:.*: replace - with \+ in Eval::centipawns$',
    'kchess-domain/src/training/guess\.rs:.*: replace > with >= in Eval::chances$',
    # Mate within 0 moves is always false, so a search that also tries 0 finds the same mates.
    'kchess-domain/src/training/lessons\.rs:.*: replace > with >= in (mates_within|quickest_mate|try_move|step_problems)$',
    # A move from a square to itself is no move.
    'kchess-domain/src/training/puzzle\.rs:.*: replace > with >= in castling_side$',
    # A combo of 30 is answered by the table, with the value the fallthrough would give.
    'kchess-domain/src/training/rush\.rs:.*: replace > with >= in combo_bonus_ms$',
    # The extra token is `pv` itself, which is no UCI move and is filtered out.
    'kchess-domain/src/training/uci_info\.rs:.*: replace \+ with \* in parse_info$',
]
