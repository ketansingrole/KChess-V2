# cargo-mutants (`cargo install cargo-mutants`): `cargo mutants -p <package>` changes the code one
# small edit at a time and reports each edit no test notices. See docs/mutation-testing.md.

# Mutants no test can tell apart from the original, because the program behaves the same. Each
# entry names why; never add one only because a test is missing.
exclude_re = [
    # A load command shorter than 8 bytes and a whole number of 8-byte words can only be 0 long,
    # and a 0-long one is read again until the command count runs out, finding no symbol table:
    # `None` either way.
    'tooling/xtask/src/sweep\.rs:.*: replace \|\| with && in debug_map',
    # The version bits are cleared by the mask first, so `| 0x40` and `^ 0x40` (and `| 0x80` and
    # `^ 0x80`) set the same byte.
    'kchess-games/src/archive\.rs:.*: replace \| with \^ in new_id',
    # A deadline compared with `<=` instead of `<` differs only at the very instant it passes, and
    # the next attempt's own deadline ends the loop at that instant either way.
    'kchess-service/src/client\.rs:.*: replace < with <= in (connect_or_start|wait_until_gone)',
    # `plain` names no message: `None`, which is also what `Default::default()` is for a `Msg`.
    'kchess-contracts/src/check\.rs:.*: replace plain -> Msg with Default::default\(\)$',
    # The command line closes its core only as the process exits, with the core's writes already
    # on disk: what a test can see afterwards is the same whether or not it was closed.
    'apps/cli/src/core\.rs:.*: replace CoreClient::close with \(\)$',
    # The Lichess client only builds its request with this client; `Policy::send` executes it with
    # the policy's own, which adds the headers and deadlines. Any client builds the same request.
    'kchess-core/src/lichess/policy\.rs:.*: replace Policy::http -> &reqwest::Client with ',
    # Setting the folder's mode to 0700 when it already is 0700 changes nothing.
    'kchess-service/src/discovery\.rs:.*: replace & with [|^] in private_dir',
    # DETACHED_PROCESS and CREATE_NEW_PROCESS_GROUP share no bit, so `|` and `^` are the same.
    'kchess-service/src/client\.rs:.*: replace \| with \^ in launch',
    # A uniform draw picks White half the time whether below or above 0.5 counts, and exactly
    # 0.5 has no weight.
    'kchess-games/src/lib\.rs:.*: replace < with (>|<=) in draw_color',
    # Every numeric setting (the sound volume and the correspondence poll) has its own arm before
    # it, so no stored setting reaches the general numeric arm: without it, `_ => None` answers
    # what it would have.
    'kchess-core/src/store/games\.rs:.*: delete match arm \(_, Value::Number\(_\)\) in stored_setting$',
    # A storage call is logged as slow past the lane's limit; `>=` differs only for a call that
    # lasts the limit to the nanosecond. Logging past the limit and not before is tested
    # (`a_slow_call_is_logged_with_its_caller`).
    'kchess-core/src/store/sql\.rs:.*: replace > with >= in Lane::run_admitted$',
    # A patch exactly as long as the file whole: either makes the same file, and no input makes
    # bsdiff's compressed patch and bzip2's whole file the same length to test it.
    'kchess-delta/src/lib\.rs:.*: replace < with <= in build',
    # Mutants run on x86-64, where the arm64 arm is never taken; the app's updater tests use it on
    # the Apple Silicon runner (CI's `gpui` job on macOS), where every asset name needs it.
    'kchess-delta/src/assets\.rs:.*: delete match arm "aarch64" in Arch::current$',
    # Every signer reads as unsigned where mutants run (Linux): `codesign` is macOS's and
    # Authenticode PowerShell's, so a staged update and the running app always match there. What
    # it calls is tested (`an_update_is_signed_as_the_app_it_replaces`, and on macOS
    # `codesign_reads_who_signed_a_bundle`).
    'apps/gpui/src/updates\.rs:.*: (replace signed_as_running -> Result<\(\), String> with Ok\(\(\)\)|delete ! in signed_as_running)$',
    # Makes the installers with makensis, which only the Windows package jobs have (the Windows
    # upgrade workflow installs and checks what it makes); the scripts it runs are tested.
    'xtask/src/package/windows\.rs:.*: (replace package -> Result<Vec<PathBuf>> with .*|replace / with [%*] in package)$',
    # Forgets a Windows installation in the registry; elsewhere it does nothing, so a run on Linux
    # cannot tell it from nothing. The Windows upgrade workflow's patch step needs it.
    'tooling/xtask/src/deltas\.rs:.*: replace forget_installation with \(\)$',
    # `appimage` only binds the real pins, cache and download to `appimage_with`, which its test
    # runs whole with a stand-in appimagetool; the binding itself downloads from GitHub and runs
    # the real tool, so it is seen only by `cargo xtask package` on Linux (CI's package job).
    'tooling/xtask/src/package/linux\.rs:.*: replace appimage -> Result<PathBuf> with ',
    # `fairy::build` and `voice::stage` only bind the real pins, `target` folders and download to
    # `build_with` and `stage_with`, which their tests run whole with stand-in archives; the
    # bindings themselves download from GitHub (and `build` compiles Fairy-Stockfish), so they
    # are seen only by `cargo xtask fairy-stockfish`, `voice-runtime` and `package`.
    'tooling/xtask/src/fairy\.rs:.*: replace build -> Result<PathBuf> with ',
    'tooling/xtask/src/voice\.rs:.*: replace stage -> Result<PathBuf> with ',
    # Likewise bindings of the real environment, tools and repository to what their tests run
    # whole: `stage_if_outdated` to `outdated` and `stage`; `engines::run` to `run_with` with
    # `stockfish` (which runs kchess-core's fetch_stockfish, downloading from GitHub) and
    # `fairy::build`; the app's `engine` to that `stockfish`; `update_key::sign` to `sign_with`
    # with the release job's secret; `release::verify` to `metadata` with the repository's files
    # and `tag_build` (GITHUB_REF, unset or a branch where tests run). Each is seen only when its
    # command runs: `cargo xtask app`, `engines` (CI's check and mutants jobs), `sign-sums` and
    # `release-verify` (the Release workflow), `check` (CI's check job).
    'tooling/xtask/src/voice\.rs:.*: replace stage_if_outdated -> Result<\(\)> with ',
    'tooling/xtask/src/engines\.rs:.*: replace (stockfish -> Result<PathBuf>|run -> Result) with ',
    'tooling/xtask/src/app\.rs:.*: replace engine -> Result<PathBuf> with ',
    'tooling/xtask/src/update_key\.rs:.*: replace sign -> Result with ',
    'tooling/xtask/src/release\.rs:.*: replace (verify -> Result|tag_build -> Option<String>) with ',
    # Stops the profile's running core service by its process ID; which one is outdated is
    # `outdated_service`, tested. Seen by `cargo xtask app`.
    'tooling/xtask/src/app\.rs:.*: replace stop_outdated_service -> Result with ',
    # Run cargo fmt, clippy and the test suites over the whole workspace, so a test of them
    # would run `check` inside `check`; what they decide is tested (`test_commands`,
    # `coverage_args`, `with_dependents`, `scope_of`, `select`, `merge_base`). CI's check job
    # runs them and its log shows each step. `fast` only runs what `select` chose.
    'tooling/xtask/src/check\.rs:.*: replace (format|clippy_workspace|lints|tests|fast|full|full_with|check) -> Result with ',
    # Commands over the repository's own files and `cargo metadata`, which pass there, so a test
    # sees the same `Ok` from them as from their mutants; what they decide is tested: the hack's
    # `dependencies`, `outside` and `packages`, the notices' `direct_dependencies` and `names`,
    # the license file's `shipped_crates` and `license_text`. `check` runs the first two.
    'tooling/xtask/src/hack\.rs:.*: replace check -> Result with ',
    'tooling/xtask/src/licenses\.rs:.*: replace (check_notices|write) -> Result with ',
    'tooling/xtask/src/check\.rs:.*: .* in fast$',
    # `check`'s entry and its tests without cargo-llvm-cov: whether it leaves out the app's tests
    # is `without_app_tests` and `uncovered`, tested; CI's check job runs the rest.
    'tooling/xtask/src/check\.rs:.*: (delete ! in check|replace != with == in tests)$',
    # The Git pre-push hook: reads the push from standard input and runs `check` or cargo-mutants
    # on the working tree, so a test of it would run them inside the tests; what it decides is
    # tested (`main_pushes`, `push_problem`, `head_push`, `mutants_base`, `jobs_for`,
    # `branch_mutants_args`).
    # Every push from a clone with `cargo xtask install-hooks` runs it.
    'tooling/xtask/src/check\.rs:.*: (replace (pre_push|branch_mutants) -> Result with |.* in (pre_push|branch_mutants)$)',
    # `mutants`' entry and its plan: they run cargo-mutants on the repository itself, so a test of
    # them would run it inside the tests; what the plan decides is tested (`shards_for`,
    # `plan_outputs`, `count_since`, `count_listed`), and CI's mutants-plan job runs it on every
    # pull request.
    'tooling/xtask/src/mutants\.rs:.*: (replace (plan|run) -> Result with |.* in (plan|run)$)',
    # Talk to GitHub through gh: the Electron step's download and manifests, the release check of
    # a commit's CI, the draft upload and the Snap download. What they decide is tested
    # (`check_step`, `check_sums`, `matches`, `manifest_text`, `ci_verdict`, `needs_ci`,
    # `pushed_tag`, `verify_snap`); the Release and Snap publish workflows run them.
    'tooling/xtask/src/electron_step\.rs:.*: replace (download -> Result<Vec<u8>>|write -> Result) with ',
    'tooling/xtask/src/release\.rs:.*: replace (verify_release|attach_draft|download_snap) -> Result with ',
    'tooling/xtask/src/release\.rs:.*: delete ! in verify_release$',
    # Package with platform tools absent where mutants run: snapcraft (the Snap build workflow),
    # codesign, ditto, hdiutil, notarytool and productbuild (macOS), and the whole `package`
    # command over a release build. The scripts, plists, bundle layout and checks they use are
    # tested; CI's package, Snap and Windows upgrade jobs run them.
    'tooling/xtask/src/package/linux\.rs:.*: replace snap -> Result<PathBuf> with ',
    'tooling/xtask/src/package/mac\.rs:.*: replace sign -> Result with ',
    'tooling/xtask/src/package/(mac|mas)\.rs:.*: replace package -> Result<Vec<PathBuf>> with ',
    'tooling/xtask/src/package/mod\.rs:.*: replace run -> Result with ',
]
