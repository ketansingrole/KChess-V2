[workspace]
resolver = "3"
members = ["crates/kchess-domain", "crates/kchess-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
shakmaty = { version = "0.30", features = ["variant"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memchr = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
