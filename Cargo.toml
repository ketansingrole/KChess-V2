[workspace]
resolver = "3"
members = ["crates/kchess-domain", "crates/kchess-core", "crates/kchess-games", "crates/kchess-contracts", "crates/kchess-voice", "crates/kchess-service", "apps/gpui", "apps/cli", "tooling/xtask"]
# cargo-fuzz targets build on their own nightly (fuzz/rust-toolchain.toml); vendored crates keep
# their own manifests and lints.
exclude = ["fuzz", "vendor/gpui-pre", "vendor/gpui-pre-apple", "vendor/gpui-pre-macos", "vendor/gpui-pre-windows"]

[workspace.package]
# The KChess release: `YEAR.MONTH.COUNTER` (`cargo xtask release-version`), the version every
# binary reports and every package is named with.
version = "2026.11.5"
edition = "2024"
# Matches rust-toolchain.toml so `cargo` warns on older toolchains.
rust-version = "1.98.0"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
# deny, not forbid: the few modules that must call the OS (the Dock icon, the microphone, Windows'
# DPAPI) allow it locally with SAFETY comments.
unsafe_code = "deny"
# warn breaks `cargo clippy -- -D warnings` (fires on build.rs and many
# undocumented items); keep allow until docs are added.
missing_docs = "allow"

[workspace.lints.clippy]
# Verified zero hits on green code; existing unsafe blocks carry SAFETY comments.
undocumented_unsafe_blocks = "deny"
# None of these entries changes a build: `-D warnings` only promotes lints that already fire,
# and nothing in `cargo xtask check` enables these. They document what switching one on would
# cost. Shipped Rust is the app, the core service, the CLI and the `kchess-voice` bin;
# `kchess-core`'s `kchess-fake-uci` and `kchess-fake-voice` bins are test scaffolding.
# unwrap_used/expect_used are enforced for shipped targets by the second clippy pass in
# `cargo xtask check`; test targets keep this exemption, because a panicking test is a failing
# test rather than a shipped panic path.
# Measured 2026-10-17: cast_possible_truncation 38 hits over 40 files, none with more than 7.
cast_possible_truncation = "allow"
# Denied per module (`#![cfg_attr(not(test), deny(...))]`) where outside input is parsed: PGN
# (`pgn.rs`), engine output (`uci_info.rs`), Lichess streams and feeds (`stream.rs`, `feed.rs`).
# Measured 2026-10-17: 284 hits elsewhere over 51 library files.
indexing_slicing = "allow"
unwrap_used = "allow"
expect_used = "allow"
# From Google's Rust style guide (2026-11-06): the rules a lint can hold that the code already
# nearly kept (its few hits fixed then). `clone` is named as one, not hidden in `to_string` or
# `to_owned`; `format!` rather than `+` on strings; `let … else` rather than a match that only
# returns. `cargo xtask check` denies warnings, so these fail it. `use gpui_kit::*` stays: it is
# GPUI Kit's prelude, which the guide leaves to the reviewer.
implicit_clone = "warn"
string_add = "warn"
manual_let_else = "warn"
cloned_instead_of_copied = "warn"
uninlined_format_args = "warn"
# A function's cognitive complexity (nesting-weighted branches, `clippy.toml` sets the limit) stays
# at or under 25. Flat `match` dispatchers score low here where cyclomatic counts score them high,
# so the limit catches tangled logic rather than wide APIs.
cognitive_complexity = "warn"

[workspace.dependencies]
shakmaty = { version = "0.30", features = ["variant"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth", "float_roundtrip"] }
memchr = "2"
thiserror = "2"

# Development and test builds: dependencies optimized (the app's end-to-end tests and
# `cargo xtask app` run several times faster; they compile once), line tables only for
# backtraces with file and line, which keeps links and `target/` small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "fat"
overflow-checks = true
codegen-units = 1
panic = "unwind"
# Not "symbols": see .cargo/config.toml for platform-specific linker stripping.
strip = "none"

# GPUI with a window zoom (Settings → Interface size, like a browser's page zoom): see
# vendor/gpui-pre/KCHESS-PATCH.md for what differs from the published 0.3.11 (and the
# KCHESS-PATCH.md beside gpui-pre-apple for its own). The macOS and Windows backends answer
# notifications with typed text: their own KCHESS-PATCH.md.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
