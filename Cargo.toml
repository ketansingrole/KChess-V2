[workspace]
resolver = "3"
members = ["crates/kchess-domain", "crates/kchess-core", "crates/kchess-node", "crates/kchess-wasm", "crates/kchess-contracts", "crates/kchess-voice", "apps/gpui"]
# cargo-fuzz targets build on their own nightly (fuzz/rust-toolchain.toml); vendored crates keep
# their own manifests and lints.
exclude = ["fuzz", "vendor/gpui-pre"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches rust-toolchain.toml so `cargo` warns on older toolchains.
rust-version = "1.98.0"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
# deny, not forbid: napi-derive expands to #[allow(unsafe_code)], which is
# E0453-incompatible with forbid. deny still fails the build on direct unsafe.
unsafe_code = "deny"
# warn breaks `cargo clippy -- -D warnings` (fires on build.rs and many
# undocumented items); keep allow until docs are added.
missing_docs = "allow"

[workspace.lints.clippy]
# Verified zero hits on green code; existing unsafe blocks carry SAFETY comments.
undocumented_unsafe_blocks = "deny"
# None of these entries changes a build: `-D warnings` only promotes lints that already fire,
# and nothing in `check:rust-lint` enables these. They document what switching one on would
# cost. Shipped Rust is library targets (the N-API cdylib included) and the `kchess-voice` bin;
# `kchess-core`'s `kchess-fake-uci` and `kchess-fake-voice` bins are test scaffolding.
# unwrap_used/expect_used are enforced for shipped targets by the second clippy pass in
# `check:rust-lint`; test targets keep this exemption, because a panicking test is a failing
# test rather than a shipped panic path.
# Measured 2026-10-17: cast_possible_truncation 38 hits over 40 files, none with more than 7.
cast_possible_truncation = "allow"
# Denied per module (`#![cfg_attr(not(test), deny(...))]`) where outside input is parsed: PGN
# (`pgn.rs`), engine output (`uci_info.rs`), Lichess streams and feeds (`stream.rs`, `feed.rs`).
# Measured 2026-10-17: 284 hits elsewhere over 51 library files.
indexing_slicing = "allow"
unwrap_used = "allow"
expect_used = "allow"

[workspace.dependencies]
shakmaty = { version = "0.30", features = ["variant"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth", "float_roundtrip"] }
memchr = "2"
thiserror = "2"

[profile.release]
lto = "fat"
overflow-checks = true
codegen-units = 1
panic = "unwind"
# Not "symbols": see .cargo/config.toml for platform-specific linker stripping.
strip = "none"

# WebAssembly cannot unwind; a panic traps and the host reports it.
[profile.wasm]
inherits = "release"
panic = "abort"
# The renderer never reads DWARF or the `name` section (a trap reaches the log as its message
# only); development builds use `dev` and keep both.
strip = "symbols"

# GPUI with a window zoom (Settings → Interface size, as Electron's page zoom): see
# vendor/gpui-pre/KCHESS-PATCH.md for what differs from the published 0.3.9.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
