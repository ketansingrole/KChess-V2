[workspace]
resolver = "3"
members = ["crates/kchess-domain", "crates/kchess-core", "crates/kchess-node", "crates/kchess-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
shakmaty = { version = "0.30", features = ["variant"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth", "float_roundtrip"] }
memchr = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
# Not "symbols": see .cargo/config.toml (macOS strips at link time; elsewhere sizes are similar).
strip = "none"

# WebAssembly cannot unwind; a panic traps and the host reports it.
[profile.wasm]
inherits = "release"
panic = "abort"
