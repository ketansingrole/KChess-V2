[workspace]
members = [".", "crates/kchess_board", "crates/kchess_board_api"]
resolver = "2"

[package]
name = "kchess"
version = "0.1.0"
edition = "2024"
default-run = "KChess"

[[bin]]
name = "KChess"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
kchess_board = { path = "crates/kchess_board", features = ["gpui"] }
kchess_board_api = { path = "crates/kchess_board_api" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
unicode-segmentation = "1.11"
url = "2.5"
