[package]
name = "kchess-cli"
description = "The KChess command line: the library, Lichess login, any core method, analysis and games in a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kchess-cli"
path = "src/main.rs"

[dependencies]
kchess-core.workspace = true
kchess-host.workspace = true
kchess-contracts.workspace = true
kchess-domain.workspace = true
kchess-games.workspace = true
kchess-service.workspace = true
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal", "fs"] }
kchess-hack = { version = "0.1", path = "../../crates/kchess-hack" }

[dev-dependencies]
tempfile = "3"
kchess-testkit = { path = "../../crates/kchess-testkit" }

[lints]
workspace = true
