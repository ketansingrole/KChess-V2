[package]
name = "kchess-cli"
description = "The KChess command line: the library, Lichess login, any core method, analysis and games in a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kchess"
path = "src/main.rs"

[dependencies]
kchess-core = { path = "../../crates/kchess-core" }
kchess-contracts = { path = "../../crates/kchess-contracts" }
kchess-domain = { path = "../../crates/kchess-domain" }
kchess-games = { path = "../../crates/kchess-games" }
kchess-service = { path = "../../crates/kchess-service" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal", "fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
