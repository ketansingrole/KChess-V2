[package]
name = "kchess-gpui"
description = "KChess desktop application built with GPUI Kit over the Rust core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kchess-gpui"
path = "src/main.rs"

[dependencies]
kchess-core = { path = "../../crates/kchess-core" }
kchess-domain = { path = "../../crates/kchess-domain" }
kchess-contracts = { path = "../../crates/kchess-contracts" }
gpui-kit = "0.8"
serde.workspace = true
serde_json.workspace = true
shakmaty.workspace = true
# The core's runtime: its services are Tokio tasks (`kchess-core`).
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# A random Chess960 start (already in Cargo.lock through the core).
getrandom = "0.4"
# Channels from the core's threads to the UI thread.
futures = "0.3"
# The Electron renderer's boards, pieces and sounds, embedded (already in Cargo.lock through GPUI Kit).
rust-embed = "8"
# Move and game sounds: the default output device (cpal) and the MP3 clips (Symphonia).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }

[lints]
workspace = true
