[package]
name = "kchess-gpui"
description = "KChess desktop application built with GPUI Kit over the Rust core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The executable is named as the app: macOS labels an unbundled program (a `cargo run` build) in
# the menu bar, Dock and app switcher by its file name.
[[bin]]
name = "KChess"
path = "src/main.rs"

[features]
# Frame benchmarks of the real app (`src/bench.rs`, run by `cargo xtask bench`).
bench = ["gpui-kit/profiler"]

[dependencies]
kchess-core.workspace = true
kchess-host.workspace = true
# The shared core: one core per profile for every KChess window (docs/shared-core.md).
kchess-service.workspace = true
kchess-domain.workspace = true
kchess-games.workspace = true
kchess-contracts.workspace = true
# The design system: the theme, motion and the chart (`crates/kchess-ui`).
kchess-ui.workspace = true
# The app's services: the core as the app holds it, Settings, preferences, the log (`crates/kchess-app`).
kchess-app.workspace = true
# The board and the games on it (`crates/kchess-board`).
kchess-board.workspace = true
# The pages as the shell drives them (`crates/kchess-nav`).
kchess-nav.workspace = true
# Pinned: a newer gpui-kit requires a newer gpui-pre than the patched copy in vendor/gpui-pre
# (Cargo.toml [patch.crates-io]); rebase that patch before moving it.
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
shakmaty.workspace = true
# The core's runtime: its services are Tokio tasks (`kchess-core`).
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util"] }
# A random Chess960 start (already in Cargo.lock through the core).
getrandom = "0.4"
# Channels from the core's threads to the UI thread.
futures = "0.3"
# The app's icons, embedded (already in Cargo.lock through GPUI Kit).
rust-embed = "8"
# Dates and times in local time and UTC (`src/dates.rs`).
jiff = "1.0"
# The Downloads folder exports start in.
dirs = "7"
# Exported pictures of a game: the board and pieces drawn (resvg), encoded as PNG or GIF (image);
# both already in Cargo.lock through GPUI.
resvg = "0.49"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# App updates: the release feed and its packages (the core's HTTP client), checked against the
# release's SHA-256 sums; both already in Cargo.lock through the core.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "gzip"] }
sha2 = { version = "0.11", default-features = false }
# Small updates: the next release rebuilt from the installed files (`updates/patch.rs`), and a
# .deb of them for the package manager (tar, already in Cargo.lock through the tooling).
kchess-delta.workspace = true
tar = { version = "0.4", default-features = false }
# Desktop notifications while KChess is in the background (already in Cargo.lock through GPUI).
notify-rust = "4.18"
# Voice input: the microphone (cpal, already in Cargo.lock through the board's rodio) and the PCM the core's
# recognizer takes, as base64 (already in Cargo.lock through the core).
cpal = "0.18"
base64 = "0.23"
kchess-hack = { version = "0.1", path = "../../crates/kchess-hack" }

[lints]
workspace = true

# Microphone access status and the system's request for it: AVCaptureDevice, macOS 10.14 and
# later.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSBundle"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
# Swapping an update's bundle with the installed one in one step (`renamex_np` behind rustix's
# safe `renameat_with`), and the benchmark's CPU time and peak memory (`getrusage` behind nix's
# safe wrapper); both already in Cargo.lock.
rustix = { version = "1", features = ["fs"] }
nix = { version = "0.31", default-features = false, features = ["resource"] }
# The Dock icon: NSApplication's icon image.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSAccessibility"] }

[target.'cfg(windows)'.dependencies]
# KChess's AppUserModelID on its shortcuts (`windows_shortcuts.rs`); already in Cargo.lock.
windows = { version = "0.62", features = [
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

# The release version, and on Windows the executable's icon and version (`build.rs`); both
# already in Cargo.lock.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# The slow calls a frame made, which the end-to-end tests fail on (`slow_calls::drawing`).
kchess-app = { workspace = true, features = ["test-support"] }
# The sounds played and the board images kept, which the end-to-end tests read.
kchess-board = { workspace = true, features = ["test-support"] }
# Headless windows for the rendering regressions (`#[gpui_kit::test]`).
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
# A fresh profile per end-to-end test (`src/e2e`).
tempfile = "3"
# The stand-in Lichess and Chess.com the end-to-end tests talk to (`src/e2e/fake_*.rs`).
kchess-testkit.workspace = true
# Release keys that sign the updater tests' checksums (`src/updates/tests.rs`).
ring = "0.17"
# A profile document the core cannot read, written beside the running core (`src/e2e`); the
# core's own version, already in Cargo.lock.
rusqlite = { version = "0.41", features = ["bundled"] }

# Real text shaping for the offscreen screenshots (`src/e2e/screens.rs`), without the Mac platform
# that only the main thread may create; already in Cargo.lock under gpui-kit.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = "0.3.11"
