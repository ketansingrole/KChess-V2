[package]
name = "kchess-gpui"
description = "KChess desktop application built with GPUI Kit over the Rust core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The executable is named as the app: macOS labels an unbundled program (a `cargo run` build) in
# the menu bar, Dock and app switcher by its file name.
[[bin]]
name = "KChess"
path = "src/main.rs"

[features]
# Frame benchmarks of the real app (`src/bench.rs`, `tooling/gpui-render-benchmark.mjs`).
bench = ["gpui-kit/profiler"]

[dependencies]
kchess-core = { path = "../../crates/kchess-core" }
# The shared core: one core per profile for every KChess window (docs/shared-core.md).
kchess-service = { path = "../../crates/kchess-service" }
kchess-domain = { path = "../../crates/kchess-domain" }
kchess-contracts = { path = "../../crates/kchess-contracts" }
gpui-kit = "0.8"
serde.workspace = true
serde_json.workspace = true
shakmaty.workspace = true
# The core's runtime: its services are Tokio tasks (`kchess-core`).
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util"] }
# A random Chess960 start (already in Cargo.lock through the core).
getrandom = "0.4"
# Channels from the core's threads to the UI thread.
futures = "0.3"
# The Electron renderer's boards, pieces and sounds, embedded (already in Cargo.lock through GPUI Kit).
rust-embed = "8"
# Move and game sounds: the default output device (cpal) and the MP3 clips (Symphonia).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
# Game history's dates in local time, and the Downloads folder exports start in (already in
# Cargo.lock through GPUI Kit).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
# Exported pictures of a game: the board and pieces drawn (resvg), encoded as PNG or GIF (image);
# both already in Cargo.lock through GPUI.
resvg = "0.46"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# App updates: the release feed and its packages (the core's HTTP client), checked against the
# release's SHA-256 sums; both already in Cargo.lock through the core.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
sha2 = { version = "0.11", default-features = false }
# Desktop notifications while KChess is in the background (already in Cargo.lock through GPUI).
notify-rust = "4.18"
# Voice input: the microphone (cpal, already in Cargo.lock through rodio) and the PCM the core's
# recognizer takes, as base64 (already in Cargo.lock through the core).
cpal = "0.18"
base64 = "0.22"
# Redacting the diagnostic log (already in Cargo.lock through the core's dependencies).
regex = "1"

[lints]
workspace = true

# Microphone access status and the system's request for it (`systemPreferences.getMediaAccess
# Status` / `askForMediaAccess` in Electron): AVCaptureDevice, macOS 10.14 and later.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSBundle"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
# Swapping an update's bundle with the installed one in one step (`renamex_np`; already in
# Cargo.lock).
libc = "0.2"
# The Dock icon (`app.dock.setIcon` in Electron): NSApplication's icon image.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
