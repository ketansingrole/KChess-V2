[package]
name = "kchess-gpui"
description = "KChess desktop application built with GPUI Kit over the Rust core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The executable is named as the app: macOS labels an unbundled program (a `cargo run` build) in
# the menu bar, Dock and app switcher by its file name.
[[bin]]
name = "KChess"
path = "src/main.rs"

[features]
# Frame benchmarks of the real app (`src/bench.rs`, run by `cargo xtask bench`).
bench = ["gpui-kit/profiler"]

[dependencies]
kchess-core = { path = "../../crates/kchess-core" }
# The shared core: one core per profile for every KChess window (docs/shared-core.md).
kchess-service = { path = "../../crates/kchess-service" }
kchess-domain = { path = "../../crates/kchess-domain" }
kchess-games = { path = "../../crates/kchess-games" }
kchess-contracts = { path = "../../crates/kchess-contracts" }
# Pinned: a newer gpui-kit requires a newer gpui-pre than the patched copy in vendor/gpui-pre
# (Cargo.toml [patch.crates-io]); rebase that patch before moving it.
gpui-kit = "=0.9.0"
serde.workspace = true
serde_json.workspace = true
shakmaty.workspace = true
# The core's runtime: its services are Tokio tasks (`kchess-core`).
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util"] }
# A random Chess960 start (already in Cargo.lock through the core).
getrandom = "0.4"
# Channels from the core's threads to the UI thread.
futures = "0.3"
# The boards, pieces and sounds, embedded (already in Cargo.lock through GPUI Kit).
rust-embed = "8"
# Move and game sounds: the default output device (cpal) and the MP3 clips (Symphonia).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
# Game history's dates in local time, and the Downloads folder exports start in (already in
# Cargo.lock through GPUI Kit).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
# Exported pictures of a game: the board and pieces drawn (resvg), encoded as PNG or GIF (image);
# both already in Cargo.lock through GPUI.
resvg = "0.49"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# App updates: the release feed and its packages (the core's HTTP client), checked against the
# release's SHA-256 sums; both already in Cargo.lock through the core.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "gzip"] }
sha2 = { version = "0.11", default-features = false }
# Small updates: the next release rebuilt from the installed files (`updates/patch.rs`), and a
# .deb of them for the package manager (tar, already in Cargo.lock through the tooling).
kchess-delta = { path = "../../crates/kchess-delta" }
tar = { version = "0.4", default-features = false }
# Verifying the Ed25519 signature on a release's SHA256SUMS.txt (`updates.rs`); already in
# Cargo.lock under rustls.
ring = "0.17"
# Desktop notifications while KChess is in the background (already in Cargo.lock through GPUI).
notify-rust = "4.18"
# Voice input: the microphone (cpal, already in Cargo.lock through rodio) and the PCM the core's
# recognizer takes, as base64 (already in Cargo.lock through the core).
cpal = "0.18"
base64 = "0.23"

[lints]
workspace = true

# Microphone access status and the system's request for it: AVCaptureDevice, macOS 10.14 and
# later.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSBundle"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
# Swapping an update's bundle with the installed one in one step (`renamex_np` behind rustix's
# safe `renameat_with`), and the benchmark's CPU time and peak memory (`getrusage` behind nix's
# safe wrapper); both already in Cargo.lock.
rustix = { version = "1", features = ["fs"] }
nix = { version = "0.31", default-features = false, features = ["resource"] }
# The Dock icon: NSApplication's icon image; and the system's
# reduced-motion setting (NSWorkspace).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSAccessibility", "NSWorkspace"] }

# The system's reduced-motion setting (`SystemParametersInfoW`; already in Cargo.lock).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
# KChess's AppUserModelID on its shortcuts (`windows_shortcuts.rs`); already in Cargo.lock.
windows = { version = "0.62", features = [
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

# The release version, and on Windows the executable's icon and version (`build.rs`); both
# already in Cargo.lock.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# Headless windows for the rendering regressions (`#[gpui_kit::test]`).
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
# A fresh profile per end-to-end test (`src/e2e`).
tempfile = "3"

# Real text shaping for the offscreen screenshots (`src/e2e/screens.rs`), without the Mac platform
# that only the main thread may create; already in Cargo.lock under gpui-kit.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = "0.3.11"
