[package]
name = "xtask"
description = "KChess's own tooling: checks, the pre-push hook, release versions, licenses and packaging (`cargo xtask`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The update patches (`deltas`).
kchess-delta = { path = "../../crates/kchess-delta" }
serde_json = { workspace = true }
sha2 = { version = "0.11", default-features = false }
base64 = "0.23"
# The release key (`update-key`, `sign-sums`); already in Cargo.lock under rustls.
ring = "0.17"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
# The .deb's program files as xz (`package/linux.rs`).
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
tempfile = "3"
# Drawing the app icon (`app-icon`).
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[lints]
workspace = true

[dev-dependencies]
# Parsing the workflows as YAML (`every_workflow_is_valid_yaml`).
yaml-rust2 = { version = "0.13", default-features = false }
