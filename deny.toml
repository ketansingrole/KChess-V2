# cargo-deny config: fail on RustSec vulnerabilities, unsound and unmaintained crates, yanked
# versions, unapproved licenses, wildcard version requirements, and unknown registries/git sources.
# Run with: cargo deny check

[advisories]
# Stated rather than left to cargo-deny's defaults: any advisory fails the check. Accept one only
# with an `ignore = [{ id = "RUSTSEC-…", reason = "…" }]` entry that says why.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Unmaintained crates inside GPUI Kit (`apps/gpui`), with no GPUI release that drops them yet.
# None is a vulnerability; review them when GPUI Kit is upgraded.
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, through GPUI Kit" },
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, through GPUI Kit" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: unmaintained, through GPUI Kit" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, through GPUI Kit's text shaping" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, through GPUI Kit's text shaping" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, through GPUI Kit on Linux (D-Bus)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, through GPUI Kit on Linux (D-Bus)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, through GPUI Kit on Linux (D-Bus)" },
]

[licenses]
# GPL-3.0-or-later is this repo's own license (package.json, workspace crates, shakmaty);
# Zlib (foldhash) and CDLA-Permissive-2.0 (webpki-roots) are permissive. Anything else
# needs an explicit review before it lands in the allow list.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "GPL-3.0-or-later"]
# The GPUI app (`apps/gpui`) needs these crates, reviewed as compatible with GPL-3.0-or-later:
# MPL-2.0 is file-level copyleft that allows combining with the GPL (its section 3.3);
# BSD-2-Clause, 0BSD and CC0-1.0 are permissive. They are allowed for these crates only.
exceptions = [
  # GPUI's fonts (dwrote), build (cbindgen) and settings (option-ext through dirs).
  { crate = "cbindgen", allow = ["MPL-2.0"] },
  { crate = "dwrote", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  # The MP3 decoder for move sounds (through rodio).
  { crate = "symphonia", allow = ["MPL-2.0"] },
  { crate = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
  { crate = "symphonia-core", allow = ["MPL-2.0"] },
  { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
  { crate = "arrayref", allow = ["BSD-2-Clause"] },
  { crate = "enum-iterator", allow = ["0BSD"] },
  { crate = "enum-iterator-derive", allow = ["0BSD"] },
  { crate = "hexf-parse", allow = ["CC0-1.0"] },
  { crate = "notify", allow = ["CC0-1.0"] },
  { crate = "tiny-keccak", allow = ["CC0-1.0"] },
]

[bans]
wildcards = "deny"
# Duplicates come from transitive crates (syn, windows-sys, getrandom…); report, don't fail.
multiple-versions = "warn"
# Workspace siblings are path dependencies without versions by design.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
