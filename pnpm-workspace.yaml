# Keep dependency boundaries isolated, including Electron packaging.
nodeLinker: isolated
strictDepBuilds: true
verifyDepsBeforeRun: error
allowBuilds:
  esbuild: true
  stockfish: true
  vue-demi: true
  unrs-resolver: true
  electron-winstaller: true
  fsevents: true
# Explicitly selected stable Nuxt upgrade; keep release-age exceptions version-specific.
minimumReleaseAgeExclude:
  - '@nuxt/cli@4.0.0'
  - '@nuxt/kit@4.6.0'
  - '@nuxt/nitro-server@4.6.0'
  - '@nuxt/schema@4.6.0'
  - '@nuxt/vite-builder@4.6.0'
  - '@nuxt/vite-server@4.6.0'
  - nuxt@4.6.0
